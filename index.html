<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>10-Second Bounce Challenge</title>
  <style>
html, body {
  margin: 0;
  padding: 0;
  background: #030718;
  color: #eee;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
  height: 100%;
}

/* Real viewport height — gets set by JS */
:root {
  --app-height: 100vh;
}

#gameContainer {
  display: flex;
  flex-direction: column;
  height: var(--app-height);
  box-sizing: border-box;
  background: radial-gradient(circle at 50% -10%, #1b2148 0%, #050814 55%, #000 100%);
  position: relative; /* needed for absolute touchControls */
}

#topBar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 8px 16px;
  box-sizing: border-box;
  background: linear-gradient(to right, #050814, #0c1230);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  font-size: 12px;
}

.hudGroup {
  display: flex;
  flex-direction: column;
  padding: 4px 8px;
  align-items: center;
  border-radius: 999px;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.06);
  min-width: 70px;
}
#timerHudGroup{position: absolute; right:10px;}

.hudLabel {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: #9dacff;
}

.hudValue {
  margin-top: 1px;
  font-size: 21px;
  font-weight: 600;
}

#controlsText {
  margin-left: auto;
  font-size: 11px;
  color: #c7cdfa;
  opacity: 0.9;
  white-space: nowrap;
}

/* Canvas height = full viewport minus top bar */
#gameCanvas {
  flex: 1;
  display: block;
  width: 100%;
  height: calc(var(--app-height) - 48px); /* ~topBar height */
  border-radius: 0;
  border: none;
  background: radial-gradient(circle at center, #050a16 0%, #010208 60%, #000 100%);
}

/* Touch controls stay pinned above bottom safe area */
#touchControls {
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  display: block;         /* default: hidden on desktop */
  gap: 16px;
  z-index: 10;
}

#touchControls button {
  font-size: 24px;
  padding: 8px 38px 10px 38px;
  border-radius: 999px;
  border: 1px solid rgba(196, 200, 212, 0.25);
  background: rgba(0,0,0,0.65);
  color: #f5f5ff;
  min-width: 56px;
}

#touchControls button:active {
  transform: scale(0.95);
}

/* Show controls on narrower viewports (phones/tablets) */
@media (max-width: 900px) {
  #touchControls {
    display: flex;
  }

  /* Make canvas shorter to leave room for controls */
  #gameCanvas {
    height: calc(var(--app-height) - 48px - 90px); /* top bar + controls */
  }
}

  </style>
</head>
<body>
    <script>
  // Fix for mobile browsers where 100vh includes hidden UI chrome
  function setAppHeight() {
    document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
  }
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', setAppHeight);
  setAppHeight();
</script>

const btnLeft  = document.getElementById('btnLeft');

// Helper: simulate "start" press (ArrowUp/Space behavior)
function triggerStart() {
  if (gameState === State.WAITING) {
    startLevelPlay();
  } else if (gameState === State.LEVEL_COMPLETE) {
    if (currentLevel < TOTAL_LEVELS) {
      resetLevel(currentLevel + 1);
    } else {
      gameState = State.WIN;
      displayWinScreen();
    }
  } else if (gameState === State.GAME_OVER) {
    lives = INITIAL_LIVES;
    resetLevel(1);
    gameState = State.WAITING;
  } else if (gameState === State.WIN) {
    lives = INITIAL_LIVES;
    resetLevel(1);
  }
}


    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft') { keys.left = true; }
      if (e.code === 'ArrowRight') { keys.right = true; }
      if (e.code === 'ArrowUp' || e.code === 'Space') { keys.up = true; }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft') { keys.left = false; }
      if (e.code === 'ArrowRight') { keys.right = false; }
      if (e.code === 'ArrowUp' || e.code === 'Space') { keys.up = false; }
    });

    // Prevent accidental double events on some devices
function prevent(e) { e.preventDefault(); e.stopPropagation(); }

// LEFT button
if (btnLeft) {
  // Touch
  btnLeft.addEventListener('touchstart', (e) => {
    prevent(e);
    keys.left = true;
  }, { passive: false });

  btnLeft.addEventListener('touchend', (e) => {
    prevent(e);
    keys.left = false;

    // Simple audio (beeps/hums)
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playBeep(freq, duration, type = 'sine', gainValue = 0.08) {
      try {
        ensureAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = gainValue;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        osc.start(now);
        osc.stop(now + duration);
        gain.gain.setTargetAtTime(0.0001, now + duration * 0.4, duration * 0.3);
      } catch (e) {}
    }

    function playLaunchSound(bounceCount) {
      const baseFreq = 300;
      const freq = baseFreq + bounceCount * 30;
      playBeep(freq, 0.12, 'sawtooth', 0.12);
    }

    function playDeathSound() {
      ensureAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    function playAlienSuckSound() {
      ensureAudio();
      try {
        const now = audioCtx.currentTime;

        // Whooshy downward sweep
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.45);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.5);
      } catch (e) {
        console.warn('playAlienSuckSound error', e);
      }
    }

    function playSuccessSound() {
      ensureAudio();
      console.log('playSuccessSound called');

      try {
        const now = audioCtx.currentTime;

        // Bright arpeggio: C5–E5–G5–C6
        const freqs = [523.25, 659.25, 783.99, 1046.5];

        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'triangle';
          osc.frequency.value = f;

          gain.gain.setValueAtTime(0.2, now + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.12 + 0.3);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now + i * 0.12);
          osc.stop(now + i * 0.12 + 0.32);
        });

        // Soft bass hit underneath
        const bassOsc = audioCtx.createOscillator();
        const bassGain = audioCtx.createGain();
        bassOsc.type = 'sine';
        bassOsc.frequency.setValueAtTime(130.81, now); // C3
        bassGain.gain.setValueAtTime(0.14, now);
        bassGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
        bassOsc.connect(bassGain);
        bassGain.connect(audioCtx.destination);
        bassOsc.start(now);
        bassOsc.stop(now + 0.55);
      } catch (e) {
        console.warn('playSuccessSound error', e);
      }
    }

    function playDangerHum(intensity) {
      if (intensity <= 0 || !audioCtx) return;
      playBeep(120 + 40 * intensity, 0.08, 'sine', 0.02 * intensity);

    // NEW: Projectile SFX

    let lastMusicTick = 0;

    function resetPlayerToTrampolineCenter() {
      const levelCfg = levelConfigs[currentLevel - 1];
      const trampWidth = W * levelCfg.trampWidthRatio;
      trampoline.width = trampWidth;

    function resetLevel(level) {
      currentLevel = level;
      // Recalculate lambda using the levelConfigs specific multiplier
      const lambdaL = LAMBDA_BASE * levelConfigs[currentLevel - 1].lambdaMultiplier;
      levelConfigs[currentLevel - 1].lambda = lambdaL;

      bounceCount = 0;
      timer = LEVEL_TIME;
      asteroids = [];
      alienProjectiles = []; 
      hearts = []; // Reset hearts
      stars = [];
      husks = levelConfigs[currentLevel - 1].husks.map(h => ({ ...h }));
      alienDir = 1;
      alienLanded = false;
      lastProjectileTime = 0;
      winEffect = null; 
      alienOpacity = 1.0; // Reset Alien visibility
      isInvincible = false; // Reset invincibility state

      resetPlayerToTrampolineCenter();

      updateHUD();

      setStatus(
        `LEVEL ${currentLevel} – ${cfg.theme}. ` +
        `Press SPACE or ↑ to start. Survive 10 seconds, then land on the alien!`
      );
    }

    function updateHUD() {
      const cfg = levelConfigs[currentLevel - 1];
    hudLevel.textContent = `${currentLevel} / ${TOTAL_LEVELS}: ${cfg.theme}`;
      hudLives.textContent = `❤️ x${lives}${isInvincible ? ' ✨' : ''}`; // Show star if invincible
      hudTimer.textContent = `${timer.toFixed(1)}s`; 
      // hudBounces is permanently removed
    }


    function startLevelPlay() {
      if (gameState === State.WAITING && !player.bouncing) {
        ensureAudio();
        player.bouncing = true;
        bounceCount = 1;
        const vup = computeBounceVelocity(bounceCount);
        player.vy = -vup;
        playLaunchSound(bounceCount);
        gameState = State.PLAYING;
        setStatus(
          `LEVEL ${currentLevel} START! ` +
          `Stay alive for 10 seconds. Avoid red squares, husks, and the alien suction beam.`
        );
      }
    }

    function computeBounceVelocity(N) {
      return VMIN + (VMAX - VMIN) * (1 - Math.exp(-K * N));
    }

// --- HEART SPAWN LOGIC ---
function spawnHeart(dt) {
  if (currentLevel < 5 || gameState !== State.PLAYING || hearts.length > 0) return;

  const probability = dt / 8; 
  if (Math.random() < probability) {
      hearts.push({
          x: W * 0.2 + Math.random() * W * 0.6,
          y: -30,
          vy: 0,
          radius: 12,
          deadly: false
      });
  }
}

function updateHearts(dt) {
  const HEART_GRAVITY_MULTIPLIER = 0.10; 
  hearts.forEach(h => {
      h.vy += GRAVITY * HEART_GRAVITY_MULTIPLIER * dt; 
      h.y += h.vy * dt;
  });
  hearts = hearts.filter(h => h.y < H + h.radius);
}
// --- END HEART LOGIC ---

// --- STAR SPAWN LOGIC (Invincibility) ---
function spawnStar(dt) {
  // Only spawn after level 5, during PLAYING, and if no star exists
  if (currentLevel < 6 || gameState !== State.PLAYING || stars.length > 0) return;

  // Roughly 1 star chance every 10 seconds
  const probability = dt / 10;
  if (Math.random() < probability) {
    stars.push({
      x: W * 0.2 + Math.random() * W * 0.6,
      y: -30,
      vy: 0,
      radius: 12
    });
  }
}

function updateStars(dt) {
  const STAR_GRAVITY_MULTIPLIER = 0.15;

  stars.forEach(s => {
    s.vy += GRAVITY * STAR_GRAVITY_MULTIPLIER * dt;
    s.y += s.vy * dt;
  });

  stars = stars.filter(s => s.y < H + s.radius);
}
// --- END STAR LOGIC ---


    // --- PROJECTILE FIRE LOGIC ---
    function fireProjectile(dt) {
        const cfg = levelConfigs[currentLevel - 1];
        const rate = cfg.projectileRate;

        if (rate <= 0) return;

        // Simple time-based check to fire
        if (performance.now() - lastProjectileTime > (1000 / rate)) {
            
            // Calculate direction towards player
            const dx = player.x - alien.x;
            const dy = player.y - alien.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            const speed = 300; // Constant speed for projectiles
            const vx = (dx / dist) * speed;
            const vy = (dy / dist) * speed;

            alienProjectiles.push({
                x: alien.x,
                y: alien.y + alien.size * 0.5, // Fire from bottom of alien
                vx: vx,
                vy: vy,
                radius: 6,
                deadly: true
            });
            
            playProjectileFire();
            lastProjectileTime = performance.now();
        }
    }

    function updateProjectiles(dt) {
        alienProjectiles.forEach(p => {
            p.x += p.vx * dt;
            p.y += p.vy * dt;

    function circleRectCollision(cx, cy, cr, rx, ry, rw, rh) {
      const closestX = Math.max(rx, Math.min(cx, rx + rw));
      const closestY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - closestX;
      const dy = cy - closestY;
      return (dx * dx + dy * dy) <= cr * cr;
    }

    function circleCircleCollision(ax, ay, ar, bx, by, br) {
      const dx = ax - bx;
      const dy = ay - by;
      const distSq = dx * dx + dy * dy;
      const r = ar + br;
      return distSq <= r * r;
    }

      const rh = trampoline.height;
      if (player.vy > 0 && circleRectCollision(player.x, player.y, player.radius, rx, ry, rw, rh)) {
        player.y = ry - player.radius - 0.5;
        return true;

function checkHeartCollision() {

        const currentRadius = winEffect.radius + (maxRadius * winEffect.time * 2);

        ctx.save();
        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
        ctx.lineWidth = 6 * opacity;

        // Draw outward expanding circle
        ctx.beginPath();
        ctx.arc(winEffect.x, winEffect.y, currentRadius, 0, Math.PI * 2);
        ctx.stroke();
        
        // Flash effect at center
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.8})`;
        ctx.beginPath();
        ctx.arc(winEffect.x, winEffect.y, winEffect.radius * 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

function updateDeathEffect(dt) {
  if (!deathEffect) return;
  deathEffect.time += dt;
  const duration = 0.4;
  if (deathEffect.time > duration) {
    deathEffect = null; // end the effect
  }
}

function drawDeathEffect() {
  if (!deathEffect) return;

  const duration = 0.4;
  const t = deathEffect.time / duration;
  const opacity = 1.0 - t;
  const maxRadius = 120;
  const currentRadius = deathEffect.radius + maxRadius * t * 2;

  ctx.save();
  ctx.strokeStyle = `rgba(255, 120, 120, ${opacity})`;
  ctx.lineWidth = 5 * opacity;

  // Expanding ring
  ctx.beginPath();
  ctx.arc(deathEffect.x, deathEffect.y, currentRadius, 0, Math.PI * 2);
  ctx.stroke();

  // Small flash at center
  ctx.fillStyle = `rgba(255, 200, 200, ${opacity * 0.8})`;
  ctx.beginPath();
  ctx.arc(deathEffect.x, deathEffect.y, deathEffect.radius * 1.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

    function drawUIOverlay() {
      ctx.save();
      ctx.font = '14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.textBaseline = 'top';


      // Big center message only in non-playing states
let message = '';
let subMessage = '';

      const cfg = levelConfigs[currentLevel - 1];

  if (gameState === State.WAITING) {
    drawInstructions();
    ctx.restore();
    return;
  } else if (gameState === State.LEVEL_COMPLETE) {
    message = `LEVEL ${currentLevel} COMPLETE!`;
    subMessage = (currentLevel < TOTAL_LEVELS)
      ? `Press SPACE or ↑ for Level ${currentLevel + 1}.`
      : 'You beat all levels!';
  } else if (gameState === State.GAME_OVER) {
    message = 'GAME OVER';
    subMessage = 'Press SPACE or ↑ to restart from Level 1.';
  } else if (gameState === State.WIN) {
    // ✅ Use the custom final win screen and bail out
    drawFinalWinScreen();
    ctx.restore();
    return;
  }

      if (message) {
        ctx.textAlign = 'center';

        const boxWidth = 420;
        const boxHeight = subMessage ? 80 : 54;
        const boxX = W / 2 - boxWidth / 2;
        const boxY = H / 2 - boxHeight / 2;

        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.strokeRect(boxX + 0.5, boxY + 0.5, boxWidth - 1, boxHeight - 1);

        ctx.fillStyle = '#ffe8a9';
        ctx.font = '18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillText(message, W / 2, boxY + 14);

        if (subMessage) {
          ctx.fillStyle = '#c5ccff';
          ctx.font = '13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
          ctx.fillText(subMessage, W / 2, boxY + 40);
        }
      }

      ctx.restore();
    }

    // Add this function below drawUIOverlay (around line 1080)

function drawInstructions() {
    if (gameState !== State.WAITING || currentLevel !== 1) return;
    
    ctx.save();
    ctx.textAlign = 'center';
    
    const rules = [
        "Survive for 10 seconds without hitting objects or the UFO (purple area).",
        "Use Left/Right arrows (← →) to navigate.",
        "Each bounce gets higher so be careful."
    ];
    
    const boxWidth = 520;
    const boxHeight = 200;
    const boxX = W / 2 - boxWidth / 2;
    const boxY = H / 2 - boxHeight / 2;

    // Draw background box
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);

    // Title
    ctx.fillStyle = '#ffe8a9';
    ctx.font = '22px system-ui';
    ctx.fillText("HOW TO PLAY", W / 2, boxY + 20);

    // Rules
    ctx.textAlign = 'left';
    ctx.font = '14px system-ui';
    ctx.fillStyle = '#c5ccff';
    
    rules.forEach((rule, index) => {
        ctx.fillText(rule, boxX + 30, boxY + 55 + index * 24);
    });

    // Start prompt
    ctx.textAlign = 'center';
    ctx.fillStyle = '#3ef19e';
    ctx.font = '16px system-ui';
    ctx.fillText("PRESS ↑ ARROW TO START", W / 2, boxY + boxHeight - 30);

    ctx.restore();
}

function drawFinalWinScreen() {
  if (gameState !== State.WIN) return;

  ctx.save();
  ctx.textAlign = 'center';

  // Dimmed full-screen backdrop
  ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
  ctx.fillRect(0, 0, W, H);

  // Glowy center card
  const boxWidth  = 520;
  const boxHeight = 260;
  const boxX = W / 2 - boxWidth / 2;
  const boxY = H / 2 - boxHeight / 2;

  // Outer glow-ish background
  const grd = ctx.createLinearGradient(boxX, boxY, boxX + boxWidth, boxY + boxHeight);
  grd.addColorStop(0, 'rgba(60, 255, 180, 0.18)');
  grd.addColorStop(1, 'rgba(140, 180, 255, 0.28)');
  ctx.fillStyle = grd;
  ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

  // Inner dark panel
  ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
  ctx.fillRect(boxX + 6, boxY + 6, boxWidth - 12, boxHeight - 12);

  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(boxX + 6.5, boxY + 6.5, boxWidth - 13, boxHeight - 13);

  // Title
  ctx.fillStyle = '#3ef19e';
  ctx.font = '26px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText('NEBULA GAUNTLET CLEARED!', W / 2, boxY + 38);

  // Sub-title
  ctx.fillStyle = '#ffe8a9';
  ctx.font = '16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText(`You survived all ${TOTAL_LEVELS} levels.`, W / 2, boxY + 70);

  // Stats row
  ctx.font = '14px system-ui';
  ctx.fillStyle = '#c5ccff';
  ctx.fillText(`Lives remaining: ${lives}`, W / 2, boxY + 104);
  ctx.fillText('Alien evasions mastered. Bounce control: certified.', W / 2, boxY + 128);

  // Little bullet list of “feats”
  const feats = [
    '• Dodged rocks, asteroids, beams, and projectiles',
    '• Timed the final landings on a moving UFO',
    '• Collected powerups and survived the gauntlet'
  ];
  ctx.textAlign = 'left';
  feats.forEach((line, i) => {
    ctx.fillText(line, boxX + 40, boxY + 160 + i * 18);
  });

  // Restart prompt
  ctx.textAlign = 'center';
  ctx.fillStyle = '#3ef19e';
  ctx.font = '15px system-ui';
  ctx.fillText('PRESS ↑ OR SPACE TO PLAY AGAIN', W / 2, boxY + boxHeight - 28);

  ctx.restore();
}


    function gameLoop(timestamp) {
      if (!lastTimestamp) {
        lastTimestamp = timestamp;
        requestAnimationFrame(gameLoop);
        return;
      }
      const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.033);
      lastTimestamp = timestamp;

      if (gameState === State.PLAYING) {
        handleTimerAndMusic(dt);
        spawnAsteroid(dt);
        updateAsteroids(dt);
        updateTrampoline(dt);
        updatePlayer(dt);
        updateAlien(dt);
        handleAlienThreatAudio();
        updateProjectiles(dt);
        spawnHeart(dt);
        updateHearts(dt);
        spawnStar(dt);
        updateStars(dt);
      } else if (gameState === State.POST_TIMER) {
        handleTimerAndMusic(dt);
        updateTrampoline(dt);
        updatePlayer(dt);
        updateAlien(dt);
      } else if (
        gameState === State.WAITING ||
        gameState === State.LEVEL_COMPLETE ||
        gameState === State.GAME_OVER ||
        gameState === State.WIN
      ) {
        updateTrampoline(dt);
        updateAlien(dt);
      }
      
      updateWinEffect(dt); // Update Win effect globally
      updateDeathEffect(dt);

      drawBackground();
      drawSuctionBeam();
      drawHusks();
      drawAsteroids();
      drawProjectiles();
      drawHearts();
      drawStars()
      drawTrampoline();
      drawLandingTarget(); // Draw the landing guide
      drawAlien();
      drawPlayer();
      drawWinEffect(); // Draw the visual blast
      drawDeathEffect();
      drawUIOverlay();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        if (gameState === State.WAITING) {
          startLevelPlay();
        } else if (gameState === State.LEVEL_COMPLETE) {
          if (currentLevel < TOTAL_LEVELS) {
            resetLevel(currentLevel + 1);
          } else {
            // Finished all levels, treat as WIN and restart from 1
            gameState = State.WIN;
            displayWinScreen();
          }
        } else if (gameState === State.GAME_OVER) {
          lives = INITIAL_LIVES;
          resetLevel(1);
          gameState = State.WAITING;
        } else if (gameState === State.WIN) {
          lives = INITIAL_LIVES;
          resetLevel(1);
        }
      }
    });

    resetLevel(1);
    requestAnimationFrame(gameLoop);
  })();
  </script>
