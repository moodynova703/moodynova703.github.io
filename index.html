  <style>
    /* ----------------------------------------------------------
        GLOBAL RESET & BODY
    ---------------------------------------------------------- */
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: #030718;
    }

    /* ----------------------------------------------------------
        MAIN CONTAINER (topBar + canvasWrapper)
    ---------------------------------------------------------- */
    #gameContainer {
      display: flex;
      flex-direction: column;
      height: 100dvh; /* more stable on iPad Safari */
      overflow: hidden;
      background: #030718; /* simple behind-topBar background */
    }

    /* ----------------------------------------------------------
        TOP HUD BAR
    ---------------------------------------------------------- */
    #topBar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 16px;
      background: linear-gradient(to right, #050814, #0c1230);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
    }

    .hudGroup {
      display: flex;
      flex-direction: column;
      padding: 4px 8px;
      align-items: center;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
      min-width: 70px;
    }

    #timerHudGroup {
      position: absolute;
      right: 10px;
    }

    .hudLabel {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #9dacff;
    }

    .hudValue {
      margin-top: 1px;
      font-size: 21px;
      font-weight: 600;
      color: #9dacff;
    }

    /* ----------------------------------------------------------
        CANVAS WRAPPER (scaling container)
    ---------------------------------------------------------- */
    #canvasWrapper {
      position: relative;
      flex: 1;

      display: flex;
      justify-content: center;
      align-items: center;

      background: radial-gradient(
        circle at center,
        #050a16 0%,
        #010208 60%,
        #000000 100%
      );

      padding-bottom: env(safe-area-inset-bottom);

      overflow: hidden;
      min-height: 0; /* Safari flex fix */
    }

    /* ----------------------------------------------------------
        GAME CANVAS
    ---------------------------------------------------------- */
    #gameCanvas {
      aspect-ratio: 4 / 3;
      width: 100%;
      height: auto;
      max-height: 100%;
      display: block;
      background: transparent;
    }

    /* ----------------------------------------------------------
        TOUCH CONTROLS (overlay)
    ---------------------------------------------------------- */
    #touchControls {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: none; /* default hidden on desktop */
    }

    #touchControls button {
      position: absolute;
      pointer-events: auto;
      font-size: 44px;
      padding: 10px 30px;
      border: none;
      background-color: transparent;
      border-radius: 20px;
      color: #f5f5ff;
      min-width: 56px;
      bottom: 12px;
    }

    #btnLeft {
      left: 12px;
    }
    #btnRight {
      right: 12px;
    }
    #btnStart {
      left: 50%;
      transform: translateX(-50%);
    }

    /* Show controls on tablets/phones, including iPad landscape */
    @media (max-width: 950px), (hover: none) and (pointer: coarse) {
      #touchControls {
        display: block;
      }
      #touchControls button {
        font-size: 64px;
      }
    }

    @media (max-width: 600px), (hover: none) and (pointer: coarse) {
      #touchControls button {
        font-size: 100px;
        bottom: 50px;
        border: none;
      }
    }
  </style>
</head>

      function playBeep(freq, duration, type = "sine", gainValue = 0.08) {
        try {
          ensureAudio();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.value = gainValue;
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          const now = audioCtx.currentTime;
          osc.start(now);
          osc.stop(now + duration);
          gain.gain.setTargetAtTime(
            0.0001,
            now + duration * 0.4,
            duration * 0.3
          );
        } catch (e) {}
      }

          osc.frequency.setValueAtTime(180, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(
            60,
            audioCtx.currentTime + 0.35
          );
          gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioCtx.currentTime + 0.4
          );
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        } catch (e) {}
      }

      function computeBounceVelocity(N) {
        return VMIN + (VMAX - VMIN) * (1 - Math.exp(-K * N));

          const dy = player.y - alien.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const speed = 300;
          const vx = (dx / dist) * speed;
          const vy = (dy / dist) * speed;

            x: alien.x,

            vy,

function spawnAsteroid(dt) {
        if (!currentWorld || currentWorld === "forest") return;
        const cfg = levelConfigs[currentLevel - 1];
        const lambda = cfg.lambda;
        const prob = lambda * dt;
        if (Math.random() >= prob) return;

        // NEW: Spawn Wind Gusts if in Forest Land
        if (currentWorld === 'forest' && Math.random() < 0.4) {
          const fromLeft = Math.random() < 0.5;
          const width = WIND_WIDTH_MIN + Math.random() * (WIND_WIDTH_MAX - WIND_WIDTH_MIN);
          winds.push({
            x: fromLeft ? -width : W + width,
            y: 100 + Math.random() * (H - 300),
            width,
            force: WIND_MIN_FORCE + Math.random() * (WIND_MAX_FORCE - WIND_MIN_FORCE),
            dir: fromLeft ? 1 : -1,
            vx: fromLeft ? 150 : -150, // Movement speed of the wind sprite
            life: WIND_LIFETIME_MIN + Math.random() * WIND_LIFETIME_MAX,
          });
          return;
        }

        const dirRand = Math.random();
        let type;
        if (dirRand < cfg.dirMix.H) type = 'H';
        else if (dirRand < cfg.dirMix.H + cfg.dirMix.D) type = 'D';
        else type = 'V';

        if (currentWorld === 'sea') type = 'H';

        const size = 24 + Math.random() * 12;
        let x, y, vx, vy;

        if (type === 'H') {
          const fromLeft = Math.random() < 0.5;
          y = (currentWorld === 'sea') ? getWaterSurfaceY() - 10 : 150 + Math.random() * (H - 260);
          x = fromLeft ? -size - 10 : W + size + 10;
          const speed = 140 + Math.random() * 100;
          vx = fromLeft ? speed : -speed;
          vy = 0;
        } else if (type === 'V') {
          x = 80 + Math.random() * (W - 160); y = -size - 10; vx = 0; vy = 160 + Math.random() * 100;
        } else {
          const fromLeft = Math.random() < 0.5;
          x = fromLeft ? -size - 10 : W + size + 10; y = 80 + Math.random() * 200;
          const sp = 170 + Math.random() * 100; vx = fromLeft ? sp : -sp; vy = 50 + Math.random() * 80;
        }
        asteroids.push({ x, y, vx, vy, size });
      }

function spawnWind(dt) {
    if (currentWorld !== "forest" || gameState !== State.PLAYING) return;
    
    // Increased frequency: changed from dt / 3.5 to dt / 1.5
    // Lower number = higher frequency
    if (Math.random() > dt / 1.5) return; 

    const fromLeft = Math.random() < 0.5;
    const width = WIND_WIDTH_MIN + Math.random() * (WIND_WIDTH_MAX - WIND_WIDTH_MIN);

    winds.push({
        x: fromLeft ? -width : W + width,
        y: H * 0.2 + Math.random() * H * 0.5, // Wider vertical spawn range
        width,
        // Pull force from level config if available, otherwise default
        force: (levelConfigs[currentLevel-1].windForce || 400) + (Math.random() * 200),
        dir: fromLeft ? 1 : -1,
        life: WIND_LIFETIME_MIN + Math.random() * WIND_LIFETIME_MAX,
    });
}

function updateWinds(dt) {
  winds.forEach(w => {
    w.x += w.dir * 120 * dt;
    w.life -= dt;
  });
  winds = winds.filter(w => w.life > 0);
}



      function updateAsteroids(dt) {

        for (let a of asteroids) {

          a.y += a.vy * dt;
        }
        asteroids = asteroids.filter(

        );

      /* ==========================================================
          TRAMPOLINE
      ========================================================== */
      function updateTrampoline(dt) {
        if (!currentWorld) return;
        const cfg = levelConfigs[currentLevel - 1];
        trampoline.speed = cfg.trampSpeed;
        const halfWidth = trampoline.width / 2;

        if (gameState === State.POST_TIMER) {
          trampoline.width = W;
          trampoline.speed = 0;
          trampoline.x = W * 0.5;
          return;
        }

        if (trampoline.speed > 0) {
          trampoline.x += trampoline.dir * trampoline.speed * dt;
          if (trampoline.x - halfWidth < 40) {
            trampoline.x = 40 + halfWidth;
            trampoline.dir *= -1;
          } else if (trampoline.x + halfWidth > W - 40) {
            trampoline.x = W - 40 - halfWidth;
            trampoline.dir *= -1;
          }
        }
      }

      function drawTrampoline() {
        if (!currentWorld) return;
        const halfWidth = trampoline.width / 2;
        const x = trampoline.x - halfWidth;
        const y = trampoline.y - trampoline.height / 2;

        const grd = ctx.createLinearGradient(x, y, x, y + trampoline.height);
        grd.addColorStop(0, "#3ef19e");
        grd.addColorStop(1, "#17a45f");
        ctx.fillStyle = grd;
        ctx.fillRect(x, y, trampoline.width, trampoline.height);

        ctx.strokeStyle = "#0a4f31";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + trampoline.height);
        ctx.moveTo(x + trampoline.width, y);
        ctx.lineTo(x + trampoline.width, y + trampoline.height);
        ctx.stroke();
        ctx.lineWidth = 1;
      }

      /* ==========================================================
          COLLISION HELPERS
      ========================================================== */
      function circleRectCollision(cx, cy, cr, rx, ry, rw, rh) {
        const closestX = Math.max(rx, Math.min(cx, rx + rw));
        const closestY = Math.max(ry, Math.min(cy, ry + rh));
        const dx = cx - closestX;
        const dy = cy - closestY;
        return dx * dx + dy * dy <= cr * cr;
      }

      function circleCircleCollision(ax, ay, ar, bx, by, br) {
        const dx = ax - bx;
        const dy = ay - by;
        const distSq = dx * dx + dy * dy;
        const r = ar + br;
        return distSq <= r * r;
      }

      function checkTrampolineCollision(prevY) {
        const halfWidth = trampoline.width / 2;
        const rx = trampoline.x - halfWidth;
        const ry = trampoline.y - trampoline.height / 2;
        const rw = trampoline.width;
        const rh = trampoline.height;

        const surfaceY = ry;

        const horizOverlap =
          player.x + player.radius > rx &&
          player.x - player.radius < rx + rw;

        if (player.vy > 0 && horizOverlap) {
          const prevBottom = prevY + player.radius;
          const currBottom = player.y + player.radius;
          if (prevBottom <= surfaceY && currBottom >= surfaceY) {
            player.y = surfaceY - player.radius - 0.5;
            return true;
          }
        }

        if (
          player.vy > 0 &&
          circleRectCollision(player.x, player.y, player.radius, rx, ry, rw, rh)
        ) {
          player.y = surfaceY - player.radius - 0.5;
          return true;
        }

        return false;
      }

      function bounceOnTrampoline() {
        if (gameState === State.PLAYING) {
          bounceCount++;
          const vup = computeBounceVelocity(bounceCount);
          player.vy = -vup;
          playLaunchSound(bounceCount);
          updateHUD();
        } else {
          player.vy *= -0.5;
        }
      }

      function checkAsteroidCollision() {
        for (let a of asteroids) {
          if (
            circleRectCollision(
              player.x,
              player.y,
              player.radius,
              a.x - a.size / 2,
              a.y - a.size / 2,
              a.size,
              a.size
            )
          ) {
            return true;
          }
        }
        return false;
      }

function checkHuskCollision() {
  for (let h of husks) {

    // Forest: tree trunks (rect)
    if (currentWorld === "forest") {
      const trunkW = h.size * 0.9;
      const trunkH = h.size * 4;
      const baseY = H - 40;
      const rx = h.x - trunkW / 2;
      const ry = baseY - trunkH;
      // Draw proportionally: Height is calculated based on image ratio
      // size acts as the width, height scales to match
      const treeW = h.size * 2.5; 
      const treeH = treeImgLoaded ? (treeImg.height / treeImg.width) * treeW : h.size * 6;

      if (treeImgLoaded) {
        ctx.drawImage(treeImg, h.x - treeW / 2, baseY - treeH, treeW, treeH);
      } else {
        // Fallback
        ctx.fillStyle = "#5d4037";
        ctx.fillRect(h.x - 5, baseY - treeH, 10, treeH);
      }

      if (
        circleRectCollision(
          player.x,
          player.y,
          player.radius,
          rx,
          ry,
          trunkW,
          trunkH
        )
      ) {
        return true;
      }
      continue;
    }

    // Sea: icebergs (rect, bobbing)
    if (currentWorld === "sea") {
      const baseY = getIcebergBaseY(h);
      const width = h.size * 3.0;
      const height = h.size * 5.0;
      const rx = h.x - width / 2;
      const ry = baseY - height;

      if (
        circleRectCollision(
          player.x,
          player.y,
          player.radius,
          rx,
          ry,
          width,
          height
        )
      ) {
        return true;
      }
      continue;
    }

    // Space / Earth: circle husks
    if (
      circleCircleCollision(
        player.x,
        player.y,
        player.radius,
        h.x,
        h.y,
        h.size
      )
    ) {
      return true;
    }
  }
  return false;
}


      function checkProjectileCollision() {
        for (let p of alienProjectiles) {
          if (
            p.deadly &&
            circleCircleCollision(player.x, player.y, player.radius, p.x, p.y, p.radius)
          ) {
            p.deadly = false;
            return true;
          }
        }
        return false;
      }

      function checkHeartCollision() {
        for (let i = hearts.length - 1; i >= 0; i--) {
          const h = hearts[i];
          if (
            circleCircleCollision(
              player.x,
              player.y,
              player.radius,
              h.x,
              h.y,
              h.radius
            )
          ) {
            lives++;
            playHeartCollectSound();
            setStatus("BONUS! +1 Life!");
            hearts.splice(i, 1);
            updateHUD();
            return true;
          }
        }
        return false;
      }

      function checkStarCollision() {
        for (let i = stars.length - 1; i >= 0; i--) {
          const s = stars[i];
          if (
            circleCircleCollision(
              player.x,
              player.y,
              player.radius,
              s.x,
              s.y,
              s.radius
            )
          ) {
            isInvincible = true;
            playHeartCollectSound();
            setStatus("BONUS! Invincibility for this level!");
            stars.splice(i, 1);
            updateHUD();
            return true;
          }
        }
        return false;
      }

      /* ==========================================================
          ALIEN & LANDING
      ========================================================== */
      function createAlienForPostTimer() {
        const size = alienConfig.size;
        trampoline.width = W;
        trampoline.speed = 0;
        trampoline.x = W * 0.5;
        trampoline.dir = 0;
        alien.vy = 260;
        alien.restingY = trampoline.y - trampoline.height / 2 - size * 0.4;
        alienLanded = false;
        alienLandingGraceTimer = 0;
        player.vy = Math.max(0, player.vy);
      }

      function updateAlien(dt) {
        if (!alien || !currentWorld) return;
        const cfg = levelConfigs[currentLevel - 1];

        if (gameState === State.POST_TIMER) {
          if (!alienLanded && alien.y < alien.restingY) {
            alien.vy += GRAVITY * 0.1 * dt;
            alien.y += alien.vy * dt;
            if (alien.y >= alien.restingY) {
              alien.y = alien.restingY;
              alien.vy = 0;
              alienLanded = true;
              alienLandingGraceTimer = 0;
            }
          }
        } else if (
          gameState === State.PLAYING ||
          gameState === State.WAITING
        ) {
          alien.y = 25;
          const speed = cfg.alienSpeedTop;
          if (speed > 0) {
            alien.x += alienDir * speed * dt;
            const margin = 60;
            if (alien.x < margin) {
              alien.x = margin;
              alienDir *= -1;
            } else if (alien.x > W - margin) {
              alien.x = W - margin;
              alienDir *= -1;
            }
          }
          if (gameState === State.PLAYING) {
            fireProjectile(dt);
          }
        }
      }

      function checkAlienLandingCircle() {
        if (!alien) return false;
        const baseRadius = alien.size * 1.0;
        const bonusRadius = 16;
        const alienRadius = baseRadius + bonusRadius;

        const landed = circleCircleCollision(
          player.x,
          player.y,
          player.radius,
          alien.x,
          alien.y,
          alienRadius
        );

        if (!landed) {
          const dx = Math.abs(player.x - alien.x);
          const dy = player.y - alien.y;
          if (dx < alienRadius * 0.8 && dy > 0 && dy < alienRadius * 0.7) {
            return true;
          }
        }
        return landed;
      }

      function loseLife(reason) {
        if (gameState === State.GAME_OVER || gameState === State.WIN) return;

        deathEffect = {
          x: player.x,
          y: player.y,
          radius: player.radius,
          time: 0,
        };

        winEffect = null;
        alienOpacity = 1.0;

        if (reason && reason.toLowerCase().includes("suction")) {
          playAlienSuckSound();
        } else {
          playDeathSound();
        }

        lives--;
        const prefix = reason ? `${reason} ` : "";

        if (lives <= 0) {
          gameState = State.GAME_OVER;
          setStatus(
            `${prefix}GAME OVER. ` +
              `Press SPACE or ↑ to return Home.`
          );
        } else {
          gameState = State.WAITING;
          setStatus(
            `${prefix}You lost a life. ` +
              `Lives left: ${lives}. Press SPACE or ↑ to retry Level ${currentLevel}.`
          );
        }

        resetPlayerToTrampolineCenter();
        alien = {
          x: W * 0.5,
          y: 25,
          vy: 0,
          size: alienConfig.size,
          restingY: 25,
        };

        asteroids = [];
        alienProjectiles = [];
        hearts = [];
        stars = [];
        timer = LEVEL_TIME;
        bounceCount = 0;
        alienLanded = false;
        isInvincible = false;
        updateHUD();
        updateMusicState();
        updateStartButtonVisibility();
      }

      function displayWinScreen() {
        playSuccessSound();
        winEffect = {
          x: player.x,
          y: player.y,
          radius: player.radius,
          time: 0,
        };
        updateStartButtonVisibility();
        updateMusicState();
        alienOpacity = 1.0;

        if (gameState === State.WIN) {
          setStatus(
            `GAME COMPLETE! You mastered all worlds! Press SPACE or ↑ to return Home.`
          );
        } else if (
          currentWorld === "space" &&
          currentLevel === TOTAL_LEVELS_PER_WORLD
        ) {
          setStatus(
            `Space Land cleared! Earth Land unlocked. Press SPACE or ↑ to return Home.`
          );
        } else if (
          currentWorld === "earth" &&
          currentLevel === TOTAL_LEVELS_PER_WORLD
        ) {
          setStatus(
            `Earth Land cleared! Sea Land unlocked. Press SPACE or ↑ to return Home.`
          );
        } else {
          setStatus(
            `LEVEL ${currentLevel} COMPLETE! Press SPACE or ↑ for the next level.`
          );
        }
      }

      /* ==========================================================
          TIMER & MUSIC
      ========================================================== */
      function handleTimerAndMusic(dt) {
        if (gameState === State.PLAYING) {
          timer -= dt;
          if (timer <= 0) {
            timer = 0;
            gameState = State.POST_TIMER;
            setStatus(
              "Time up! The alien is falling — land safely on it to complete the level."
            );
            createAlienForPostTimer();
          }
        }
        updateHUD();

        if (
          gameState === State.PLAYING ||
          gameState === State.POST_TIMER
        ) {
          const now = performance.now() / 1000;
          const remaining = timer;
          let interval;
          if (remaining > 5) interval = 1.1;
          else if (remaining > 2.5) interval = 0.5;
          else interval = 0.25;
          if (now - lastMusicTick > interval) {
            lastMusicTick = now;
            const base = 260 + currentLevel * 20;
            const pitchRamp = (LEVEL_TIME - remaining) / LEVEL_TIME;
            const freq = base + 140 * pitchRamp;
            playBeep(freq, 0.08, "triangle", 0.05);
          }
        }
      }

      function handleAlienThreatAudio() {
        if (!alien || !audioCtx) return;
        if (gameState === State.PLAYING) {
          const dx = Math.abs(player.x - alien.x);
          if (
            player.y < ALIEN_SUCTION_Y &&
            dx <= ALIEN_BEAM_HALF_WIDTH * 1.2
          ) {
            const distY = Math.max(0, ALIEN_SUCTION_Y - player.y);
            const intensity = Math.max(0.1, 1 - distY / 120);
            playDangerHum(intensity);
          }
        }
      }

      /* ==========================================================
          PLAYER UPDATE (with post-timer landing rules)
      ========================================================== */
      function updatePlayer(dt) {
        // STOP PHYSICS IF LEVEL COMPLETE
        if (gameState === State.LEVEL_COMPLETE || gameState === State.WIN) {
            player.vx = 0;
            player.vy = 0;
            return;
        }

        const prevY = player.y;

        if (keys.left) player.vx -= AX * dt;
        if (keys.right) player.vx += AX * dt;
        // Forest wind force
        if (currentWorld === "forest" && gameState === State.PLAYING) {
          for (let w of winds) {
            if (
              player.x > w.x - w.width / 2 &&
              player.x < w.x + w.width / 2 &&
              Math.abs(player.y - w.y) < 80
            ) {
              const falloff = 1 - Math.abs(player.x - w.x) / (w.width / 2);
              player.vx += w.dir * w.force * falloff * dt;
            }
          }
        }


        if (!keys.left && !keys.right && player.y < MIDLINE_Y) {
          player.vx *= 1 - DAMPING * dt;
        }

        player.vy += GRAVITY * dt;
        player.x += player.vx * dt;
        player.y += player.vy * dt;

        if (player.y < CEILING_Y) {
          player.y = CEILING_Y;
          if (player.vy < 0) player.vy = 0;
        }

        if (player.x < player.radius) {
          player.x = player.radius;
          if (player.vx < 0) player.vx = 0;
        }
        if (player.x > W - player.radius) {
          player.x = W - player.radius;
          if (player.vx > 0) player.vx = 0;
        }

        if (gameState !== State.POST_TIMER) {
          if (player.y > H + player.radius) {
            loseLife("You fell out of bounds.");
            return;
          }
        }

        if (gameState === State.PLAYING && alien && player.y < ALIEN_SUCTION_Y) {
          const dx = Math.abs(player.x - alien.x);
          if (dx <= ALIEN_BEAM_HALF_WIDTH) {
            loseLife("You got caught in the alien suction beam!");
            return;
          }
        }

        if (gameState === State.PLAYING) {
          if (checkTrampolineCollision(prevY)) {
            bounceOnTrampoline();
          }

          if (!isInvincible) {
            if (
              checkAsteroidCollision() ||
              checkHuskCollision() ||
              checkProjectileCollision()
            ) {
              loseLife("You hit an obstacle.");
              return;
            }
          }

          checkHeartCollision();
          checkStarCollision();
          return;
        }

        if (gameState === State.POST_TIMER) {
          if (alien && checkAlienLandingCircle()) {
            if (currentLevel >= TOTAL_LEVELS_PER_WORLD) {
              if (currentWorld === "forest") {
                // Check if Sea Land is beaten for final WIN
                gameState = State.WIN;
              } else {
                gameState = State.LEVEL_COMPLETE;
              }
            } else {
              gameState = State.LEVEL_COMPLETE;
            }
            displayWinScreen();
            return;
          }

          if (!alienLanded) {
            checkTrampolineCollision(prevY);
            return;
          }

          alienLandingGraceTimer += dt;

          if (alienLandingGraceTimer <= ALIEN_LANDING_GRACE) {
            if (alien && checkAlienLandingCircle()) {
              if (currentLevel >= TOTAL_LEVELS_PER_WORLD) {
                if (currentWorld === "forest") {
                  gameState = State.WIN;
                } else {
                  gameState = State.LEVEL_COMPLETE;
                }
              } else {
                gameState = State.LEVEL_COMPLETE;
              }
              displayWinScreen();
              return;
            }
            checkTrampolineCollision(prevY);
            return;
          }

          if (alien && checkAlienLandingCircle()) {
            if (currentLevel >= TOTAL_LEVELS_PER_WORLD) {
              if (currentWorld === "forest") {
                gameState = State.WIN;
              } else {
                gameState = State.LEVEL_COMPLETE;
              }
            } else {
              gameState = State.LEVEL_COMPLETE;
            }
            displayWinScreen();
            return;
          }

          const hitTrampoline = checkTrampolineCollision(prevY);
          const offBottom = player.y > H + player.radius;

          if (hitTrampoline || offBottom) {
            loseLife(
              "You missed the alien landing and hit the ground/trampoline."
            );
            return;
          }

          return;
        }
      }

      /* ==========================================================
          DRAWING
      ========================================================== */
function drawBackground() {
        ctx.save();

        // HOME: use home.png full-screen if available
        if (gameState === State.HOME && homeBgLoaded) {
          const img = homeBgImg;
          const imgRatio = img.width / img.height;
          const canvasRatio = W / H;

          let drawW, drawH, offsetX, offsetY;
          if (canvasRatio > imgRatio) {
            drawW = W;
            drawH = W / imgRatio;
            offsetX = 0;
            offsetY = (H - drawH) / 2;
          } else {
            drawH = H;
            drawW = H * imgRatio;
            offsetY = 0;
            offsetX = (W - drawW) / 2;
          }
          ctx.drawImage(img, offsetX, offsetY, drawW, drawH);
          ctx.restore();
          return;
        }

        // IN-GAME BACKGROUNDS
        if (currentWorld === "forest") {
          // Lush forest gradient
          const bg = ctx.createLinearGradient(0, 0, 0, H);
          bg.addColorStop(0, "#0a2614"); // Darkest canopy top
          bg.addColorStop(0.5, "#1b4d2e"); // Deep green
          bg.addColorStop(1, "#3d2b1f"); // Earthy soil floor
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, W, H);

          // Ray of light effect
          ctx.fillStyle = "rgba(255, 255, 200, 0.05)";
          ctx.beginPath();
          ctx.moveTo(W * 0.3, 0);
          ctx.lineTo(W * 0.6, 0);
          ctx.lineTo(W * 0.4, H);
          ctx.lineTo(W * 0.1, H);
          ctx.fill();
        } else if (currentWorld === "earth") {
          const sky = ctx.createLinearGradient(0, 0, 0, H);
          sky.addColorStop(0, "#59b5ff");
          sky.addColorStop(0.6, "#f9d783");
          sky.addColorStop(1, "#f5a623");
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, W, H);
          // Simple Ground line
          ctx.fillStyle = "rgba(255, 220, 150, 0.9)";
          ctx.fillRect(0, H * 0.7, W, H * 0.3);
        } else if (currentWorld === 'sea') {
          const waterSurfaceY = getWaterSurfaceY();
          ctx.fillStyle = '#59c7ff';
          ctx.fillRect(0, 0, W, waterSurfaceY);
          ctx.fillStyle = '#005f73';
          ctx.fillRect(0, waterSurfaceY, W, H - waterSurfaceY);
        } else if (currentWorld === "space") {
          ctx.fillStyle = "#02030c";
          ctx.fillRect(0, 0, W, H);
          // Starfield
          ctx.fillStyle = "white";
          for (let i = 0; i < 50; i++) {
            ctx.fillRect((i * 157) % W, (i * 97) % H, 1, 1);
          }
        }
        ctx.restore();
      }

      function drawSuctionBeam() {
        if (!alien || !currentWorld) return;
        ctx.save();
        const x = alien.x;
        const top = 0;
        const bottom = ALIEN_SUCTION_Y;
        const beamWidth = ALIEN_BEAM_HALF_WIDTH * 2;

        const grd = ctx.createLinearGradient(x, top, x, bottom);
        grd.addColorStop(0, "rgba(182,120,255,0.0)");
        grd.addColorStop(0.4, "rgba(182,120,255,0.25)");
        grd.addColorStop(1, "rgba(130,60,220,0.45)");

        ctx.fillStyle = grd;
        ctx.fillRect(
          x - ALIEN_BEAM_HALF_WIDTH,
          top,
          beamWidth,
          bottom - top
        );

        ctx.strokeStyle = "rgba(220,180,255,0.6)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x - ALIEN_BEAM_HALF_WIDTH, top);
        ctx.lineTo(x - ALIEN_BEAM_HALF_WIDTH, bottom);
        ctx.moveTo(x + ALIEN_BEAM_HALF_WIDTH, top);
        ctx.lineTo(x + ALIEN_BEAM_HALF_WIDTH, bottom);
        ctx.stroke();

        ctx.restore();
      }
      function drawHusks() {
        if (!currentWorld) return;
        for (let h of husks) {
          const size = h.size * 2;

        if (currentWorld === "forest") {
            const trunkW = 50; // Standard trunk width
            const treeH = 150; // Standard fixed height for all trees
            const baseY = H - 40;

            if (treeImgLoaded) {
                // Draw using the fixed treeH
                ctx.drawImage(treeImg, h.x - h.size, baseY - treeH, h.size * 2, treeH);
            } else {
                // Fallback: Fixed height rectangles
                ctx.fillStyle = "#4e342e";
                ctx.fillRect(h.x - trunkW / 2, baseY - treeH, trunkW, treeH);
                ctx.fillStyle = "#1b5e20";
                ctx.beginPath();
                ctx.ellipse(h.x, baseY - treeH, h.size * 1.5, 60, 0, 0, Math.PI * 2);
                ctx.fill();
            }
          } else if (currentWorld === "sea") {
            const bY = getIcebergBaseY(h);
            const width = h.size * 3.5;
            const height = h.size * 6;
            if (icebergImgLoaded) {
              ctx.drawImage(icebergImg, h.x - width / 2, bY - height, width, height);
            } else {
              ctx.fillStyle = "#b3e5fc";
              ctx.beginPath();
              ctx.moveTo(h.x, bY - height);
              ctx.lineTo(h.x - width * 0.5, bY);
              ctx.lineTo(h.x + width * 0.5, bY);
              ctx.fill();
            }
          } else if (currentWorld === "earth") {
            if (cactusImgLoaded) ctx.drawImage(cactusImg, h.x - h.size, h.y - h.size, h.size * 2, h.size * 2);
          } else if (currentWorld === "space") {
            if (asteroidImgLoaded) ctx.drawImage(asteroidImg, h.x - h.size, h.y - h.size, h.size * 2, h.size * 2);
          }
        }
      }

      function drawAsteroids() {
        if (!currentWorld) return;
        for (let a of asteroids) {
          ctx.save();
          ctx.translate(a.x, a.y);
          if (a.vx > 0) ctx.scale(-1, 1);
          if (currentWorld === "earth" && birdImgLoaded) ctx.drawImage(birdImg, -a.size/2, -a.size/2, a.size, a.size);
          else if (currentWorld === "sea" && sharkImgLoaded) ctx.drawImage(sharkImg, -a.size, -a.size/2, a.size*2, a.size);
          else if (rockImgLoaded) ctx.drawImage(rockImg, -a.size/2, -a.size/2, a.size, a.size);
          ctx.restore();
        }

        // Draw Wind Gusts
        for (let w of winds) {
            ctx.save();
            // Fades out as the wind "dies"
            ctx.globalAlpha = 0.4 * (w.life / WIND_LIFETIME_MAX);
            if (windImgLoaded) {
                // Flip the wind image if it's blowing left
                if (w.dir === -1) {
                    ctx.save();
                    ctx.translate(w.x, w.y);
                    ctx.scale(-1, 1);
                    ctx.drawImage(windImg, -w.width/2, -30, w.width, 60);
                    ctx.restore();
                } else {
                    ctx.drawImage(windImg, w.x - w.width/2, w.y - 30, w.width, 60);
                }
            }
            ctx.restore();
        }
      }

      function drawPlayer() {
        // HIDE BALL ON WIN
        if (winEffect || deathEffect || !currentWorld || gameState === State.LEVEL_COMPLETE || gameState === State.WIN) return;

        ctx.save();

        if (isInvincible) {
          const time = performance.now() * 0.001;
          const baseColor = Math.floor((time * 360) / 0.5);
          ctx.lineWidth = 4;
          for (let i = 0; i < 6; i++) {
            const hue = (baseColor + i * 60) % 360;
            ctx.strokeStyle = `hsl(${hue}, 100%, 70%)`;
            ctx.beginPath();
            ctx.arc(
              player.x,
              player.y,
              player.radius + 4,
              i * (Math.PI / 3),
              (i + 1) * (Math.PI / 3)
            );
            ctx.stroke();
          }
          ctx.lineWidth = 1;
        }

        const glow = ctx.createRadialGradient(
          player.x,
          player.y,
          player.radius * 0.2,
          player.x,
          player.y,
          player.radius * 1.3
        );
        glow.addColorStop(0, "#5bd0ff");
        glow.addColorStop(1, "#2044ff");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "rgba(255,255,255,0.5)";
        ctx.beginPath();
        ctx.arc(
          player.x - 4,
          player.y - 4,
          player.radius * 0.5,
          0,
          Math.PI * 2
        );
        ctx.stroke();

        ctx.restore();
      }

      function drawProjectiles() {
        if (!currentWorld) return;
        ctx.fillStyle = "#f0d4ff";
        for (let p of alienProjectiles) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#000000";
          ctx.lineWidth = 2; // Thickness of the border
          ctx.stroke();
        }
      }

      function drawHearts() {
        ctx.save();
        ctx.font = "24px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (let h of hearts) {
          ctx.fillText("❤️", h.x, h.y + 2);
        }
        ctx.restore();
      }

      function drawStars() {
        ctx.save();
        ctx.font = "24px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (let s of stars) {
          ctx.fillText("⭐", s.x, s.y + 2);
        }
        ctx.restore();
      }

      function drawAlien() {
        if (!alien || !currentWorld) return;

        ctx.save();
        ctx.globalAlpha = alienOpacity;
        ctx.translate(alien.x, alien.y);

        const size = alien.size * 2.2; // scale factor – tweak freely

        if (alienImgLoaded) {
          ctx.drawImage(
            alienImg,
            -size / 2,
            -size / 2,
            size,
            size
          );
        } else {
          // Fallback: old triangle UFO
          ctx.beginPath();
          ctx.moveTo(0, -alien.size * 0.6);
          ctx.lineTo(-alien.size * 0.7, alien.size * 0.4);
          ctx.lineTo(alien.size * 0.7, alien.size * 0.4);
          ctx.closePath();

          const grad = ctx.createLinearGradient(
            -alien.size,
            -alien.size,
            alien.size,
            alien.size
          );
          grad.addColorStop(0, "#b45bff");
          grad.addColorStop(1, "#7b1cff");
          ctx.fillStyle = grad;
          ctx.fill();

          ctx.strokeStyle = "#f0d4ff";
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        ctx.restore();
      }


      function drawLandingTarget() {
        if (!alien || !currentWorld) return;
        const isPreviewTime = gameState === State.PLAYING && timer < 1.6;
        const isFallingPhase =
          gameState === State.POST_TIMER && !alienLanded;
        if (!isPreviewTime && !isFallingPhase) return;

        const indicatorWidth = alien.size * 2.5;
        const indicatorHeight = 12;
        const x = alien.x - indicatorWidth / 2;
        const y = trampoline.y - trampoline.height - 6;
        const alpha = 0.5 + Math.sin(performance.now() / 300) * 0.2;

        ctx.save();
        ctx.fillStyle = `rgba(180,255,180,${alpha})`;
        ctx.fillRect(x, y, indicatorWidth, indicatorHeight);
        ctx.restore();
      }

      function updateWinEffect(dt) {
        if (!winEffect) return;
        winEffect.time += dt;
        const duration = 0.5;
        if (winEffect.time <= duration) {
          alienOpacity = 1.0 - winEffect.time / duration;
        } else {
          winEffect = null;
          alienOpacity = 0.0;
        }
      }

      function drawWinEffect() {
        if (!winEffect) return;
        const duration = 0.5;
        const maxRadius = 150;
        const opacity = 1.0 - winEffect.time / duration;
        const currentRadius =
          winEffect.radius + maxRadius * winEffect.time * 2;
        ctx.save();
        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
        ctx.lineWidth = 6 * opacity;
        ctx.beginPath();
        ctx.arc(winEffect.x, winEffect.y, currentRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.8})`;
        ctx.beginPath();
        ctx.arc(
          winEffect.x,
          winEffect.y,
          winEffect.radius * 2,
          0,
          Math.PI * 2
        );
        ctx.fill();
        ctx.restore();
      }

      function updateDeathEffect(dt) {
        if (!deathEffect) return;
        deathEffect.time += dt;
        if (deathEffect.time > 0.4) {
          deathEffect = null;
        }
      }

      function drawDeathEffect() {
        if (!deathEffect) return;
        const duration = 0.4;
        const t = deathEffect.time / duration;
        const opacity = 1.0 - t;
        const maxRadius = 120;
        const currentRadius =
          deathEffect.radius + maxRadius * t * 2;

        ctx.save();
        ctx.strokeStyle = `rgba(255, 120, 120, ${opacity})`;
        ctx.lineWidth = 5 * opacity;
        ctx.beginPath();
        ctx.arc(deathEffect.x, deathEffect.y, currentRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = `rgba(255, 200, 200, ${opacity * 0.8})`;
        ctx.beginPath();
        ctx.arc(
          deathEffect.x,
          deathEffect.y,
          deathEffect.radius * 1.4,
          0,
          Math.PI * 2
        );
        ctx.fill();
        ctx.restore();
      }
      function getIcebergBaseY(h) {
  const t = performance.now() * 0.001; // seconds
  const bob = Math.sin(t * ICEBERG_BOB_SPEED + h.x * 0.15) * ICEBERG_BOB_AMPLITUDE;
  return getWaterSurfaceY() + ICEBERG_Y_OFFSET + bob;
}


      /* ==========================================================
          UI OVERLAYS (HOME + INSTRUCTIONS + WIN)
      ========================================================== */
function drawHomeScreen() {
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(0, 0, W, H);

        const boxWidth = 740; 
        const boxHeight = 280;
        const boxX = W / 2 - boxWidth / 2;
        const boxY = H / 2 - boxHeight / 2 + 20;

        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
        ctx.strokeStyle = "rgba(255,255,255,0.16)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(boxX + 0.5, boxY + 0.5, boxWidth - 1, boxHeight - 1);

        ctx.fillStyle = "#ffe8a9";
        ctx.font = "24px system-ui";
        ctx.fillText("SELECT A WORLD", W / 2, boxY + 32);

        const cardW = 160;
        const cardH = 120;
        const cardY = boxY + 90;
        const gap = 15;
        const worlds = ["space", "earth", "sea", "forest"];
        const imgs = [spaceTileImg, earthTileImg, seaTileImg, forestTileImg];
        const locks = [false, !earthUnlocked, !seaUnlocked, !forestUnlocked];
        const colors = ["#9dacff", "#f7c94a", "#59c7ff", "#7ed321"];

        const totalW = (cardW * 4) + (gap * 3);
        const startX = W / 2 - totalW / 2;

        for (let i = 0; i < worlds.length; i++) {
          const cx = startX + i * (cardW + gap);
          
          // Draw image
          if (imgs[i].complete && imgs[i].naturalWidth !== 0) {
            ctx.drawImage(imgs[i], cx, cardY, cardW, cardH);
          } else {
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(cx, cardY, cardW, cardH);
          }
          
          // Border and Lock
          ctx.strokeStyle = locks[i] ? "#333" : colors[i];
          ctx.lineWidth = 2;
          ctx.strokeRect(cx, cardY, cardW, cardH);

          if (locks[i]) {
            ctx.fillStyle = "rgba(0,0,0,0.8)";
            ctx.fillRect(cx, cardY, cardW, cardH);
         // Draw Lock Emoji
            ctx.font = "40px serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🔒", cx + cardW/2, cardY + cardH/2);
            ctx.fillStyle = "white";
            ctx.font = "14px system-ui";
            ctx.fillText("LOCKED", cx + cardW/2, cardY + cardH/1.45);
          }

          // Label
          ctx.fillStyle = "white";
          ctx.font = "14px system-ui";
          ctx.fillText(WORLDS[worlds[i]].name, cx + cardW / 2, cardY + cardH + 25);
        }
        ctx.restore();
      }

      function drawInstructions() {
        if (gameState !== State.WAITING || currentLevel !== 1) return;
        ctx.save();
        ctx.textAlign = "center";

        const rules = [
          "Survive for 10 seconds without hitting hazards or the UFO beam.",
          "Use Left/Right arrows (← →) or touch buttons to move.",
          "Each bounce gets higher — position carefully for the final landing.",
        ];

        const boxWidth = 520;
        const boxHeight = 210;
        const boxX = W / 2 - boxWidth / 2;
        const boxY = H / 2 - boxHeight / 2;

        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
        ctx.strokeStyle = "rgba(255,255,255,0.18)";
        ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);

        ctx.fillStyle = "#ffe8a9";
        ctx.font = "22px system-ui";
        ctx.fillText(
          `HOW TO PLAY – ${WORLDS[currentWorld].name}`,
          W / 2,
          boxY + 22
        );

        ctx.textAlign = "left";
        ctx.font = "14px system-ui";
        ctx.fillStyle = "#c5ccff";
        rules.forEach((rule, index) => {
          ctx.fillText(rule, boxX + 30, boxY + 60 + index * 24);
        });

        ctx.textAlign = "center";
        ctx.fillStyle = "#3ef19e";
        ctx.font = "16px system-ui";
        ctx.fillText(
          "PRESS ↑ ARROW OR ▶️ TO START",
          W / 2,
          boxY + boxHeight - 32
        );

        ctx.restore();
      }

      function drawFinalWinScreen() {
        if (gameState !== State.WIN) return;
        ctx.save();
        ctx.textAlign = "center";

        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, W, H);

        const boxWidth = 520;
        const boxHeight = 260;
        const boxX = W / 2 - boxWidth / 2;
        const boxY = H / 2 - boxHeight / 2;

        const grd = ctx.createLinearGradient(boxX, boxY, boxX + boxWidth, boxY + boxHeight);
        grd.addColorStop(0, "rgba(60, 255, 180, 0.18)");
        grd.addColorStop(1, "rgba(140, 180, 255, 0.28)");
        ctx.fillStyle = grd;
        ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(boxX + 6, boxY + 6, boxWidth - 12, boxHeight - 12);

        ctx.strokeStyle = "rgba(255,255,255,0.16)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(boxX + 6.5, boxY + 6.5, boxWidth - 13, boxHeight - 13);

        ctx.fillStyle = "#3ef19e";
        ctx.font = "26px system-ui";
        ctx.fillText("ALL LANDS CLEARED!", W / 2, boxY + 38);

        ctx.fillStyle = "#ffe8a9";
        ctx.font = "16px system-ui";
        ctx.fillText("You survived Space, Earth, Sea, & Forest.", W / 2, boxY + 70);

        ctx.font = "14px system-ui";
        ctx.fillStyle = "#c5ccff";
        ctx.fillText(`Lives remaining: ${lives}`, W / 2, boxY + 104);
        ctx.fillText(
          "Your bounce control is officially ridiculous.",
          W / 2,
          boxY + 128
        );

        const feats = [
          "• Dodged rocks, birds, sharks, beams, and projectiles",
          "• Landed precisely on a moving UFO time after time",
          "• Adapted to low-gravity, desert chaos, and freezing waters",
        ];
        ctx.textAlign = "left";
        feats.forEach((line, i) => {
          ctx.fillText(line, boxX + 40, boxY + 160 + i * 18);
        });

        ctx.textAlign = "center";
        ctx.fillStyle = "#3ef19e";
        ctx.font = "15px system-ui";
        ctx.fillText(
          "PRESS ↑ OR SPACE TO RETURN HOME",
          W / 2,
          boxY + boxHeight - 28
        );

        ctx.restore();
      }

      function drawUIOverlay() {
        ctx.save();
        ctx.font = "14px system-ui";
        ctx.textBaseline = "top";

        if (gameState === State.HOME) {
          drawHomeScreen();
          ctx.restore();
          return;
        }

        if (gameState === State.WAITING && currentWorld) {
          drawInstructions();
          ctx.restore();
          return;
        }

        let message = "";
        let subMessage = "";

        if (gameState === State.LEVEL_COMPLETE) {
          if (
            currentWorld === "space" &&
            currentLevel === TOTAL_LEVELS_PER_WORLD
          ) {
            message = "SPACE LAND CLEARED!";
            subMessage =
              "Earth Land unlocked. Press SPACE or ↑ to return Home.";
          } else if (
            currentWorld === "earth" &&
            currentLevel === TOTAL_LEVELS_PER_WORLD
          ) {
            message = "EARTH LAND CLEARED!";
            subMessage = "Sea Land unlocked. Press SPACE or ↑ to return Home.";
          } else if (currentLevel < TOTAL_LEVELS_PER_WORLD) {
            message = `LEVEL ${currentLevel} COMPLETE!`;
            subMessage = `Press SPACE or ↑ for Level ${
              currentLevel + 1
            }.`;
          } else {
            message = `WORLD CLEARED!`;
            subMessage = "Press SPACE or ↑ to continue.";
          }
        } else if (gameState === State.GAME_OVER) {
          message = "GAME OVER";
          subMessage = "Press SPACE or ↑ to return Home.";
        } else if (gameState === State.WIN) {
          drawFinalWinScreen();
          ctx.restore();
          return;
        }

        if (message) {
          ctx.textAlign = "center";
          const boxWidth = 420;
          const boxHeight = subMessage ? 80 : 54;
          const boxX = W / 2 - boxWidth / 2;
          const boxY = H / 2 - boxHeight / 2;

          ctx.fillStyle = "rgba(0,0,0,0.55)";
          ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

          ctx.strokeStyle = "rgba(255,255,255,0.12)";
          ctx.strokeRect(boxX + 0.5, boxY + 0.5, boxWidth - 1, boxHeight - 1);

          ctx.fillStyle = "#ffe8a9";
          ctx.font = "18px system-ui";
          ctx.fillText(message, W / 2, boxY + 14);

          if (subMessage) {
            ctx.fillStyle = "#c5ccff";
            ctx.font = "13px system-ui";
            ctx.fillText(subMessage, W / 2, boxY + 40);
          }
        }

        ctx.restore();
      }

      /* ==========================================================
          INPUT: "START" (Space / Up / ▶️)
      ========================================================== */
      function triggerStart() {
        if (gameState === State.HOME) {
          // By default, start Space Land
          if (!currentWorld) {
            enterWorld("space");
          }
          return;
        }

        if (gameState === State.WAITING) {
          startLevelPlay();
        } else if (gameState === State.LEVEL_COMPLETE) {
          if (
            currentWorld === "space" &&
            currentLevel === TOTAL_LEVELS_PER_WORLD
          ) {
            earthUnlocked = true;
            gameState = State.HOME;
            currentWorld = null;
            updateHUD();
            updateMusicState();
          } else if (
            currentWorld === "earth" &&
            currentLevel === TOTAL_LEVELS_PER_WORLD
          ) {
            seaUnlocked = true; // Unlock Sea Land
            gameState = State.HOME;
            currentWorld = null;
            updateHUD();
            updateMusicState();
          } else if (
            currentWorld === "sea" &&
            currentLevel === TOTAL_LEVELS_PER_WORLD
          ) {
            forestUnlocked = true;
            gameState = State.HOME;
            currentWorld = null;
            updateHUD();
            updateMusicState();
          } else if (
  currentWorld === "forest" &&
  currentLevel === TOTAL_LEVELS_PER_WORLD
) {
  gameState = State.WIN;
} else if (currentLevel < TOTAL_LEVELS_PER_WORLD) {
  resetLevel(currentLevel + 1);
} else {
            // Should only happen if total levels per world changes, but fallback to home
            gameState = State.HOME;
            currentWorld = null;
            updateMusicState();
          }
        } else if (gameState === State.GAME_OVER) {
          gameState = State.HOME;
          currentWorld = null;
          updateMusicState();
        } else if (gameState === State.WIN) {
          gameState = State.HOME;
          currentWorld = null;
          updateMusicState();
        }
        updateStartButtonVisibility();
      }

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "ArrowUp") {
          triggerStart();
        }
        if (currentWorld && e.key >= "1" && e.key <= "9") {
        resetLevel(parseInt(e.key));
        // If jumping from home, ensure music starts
        if (gameState === State.HOME) {
            gameState = State.WAITING;
            updateMusicState();
        }
    }
    
    // Press '0' for level 10
    if (currentWorld && e.key === "0") {
        resetLevel(10);
    }
      });

      /* ==========================================================
          HOME SCREEN CLICK HANDLING (world selection)
      ========================================================== */
 canvas.addEventListener("click", (e) => {
        if (gameState !== State.HOME) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const scaleY = H / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;

        const boxWidth = 700;
        const boxHeight = 280;
        const boxX = W / 2 - boxWidth / 2;
        const boxY = H / 2 - boxHeight / 2;

        const cardWidth = 160; // Adjusted for 4 cards
        const cardHeight = 120;
        const cardY = boxY + 90;
        const cardGap = 15;

        // Calculate positions for all 4 cards
        const worlds = ["space", "earth", "sea", "forest"];
        const totalWidth = (cardWidth * 4) + (cardGap * 3);
        const startX = W / 2 - totalWidth / 2;

        function inRect(px, py, rx, ry, rw, rh) {
          return (px >= rx && px <= rx + rw && py >= ry && py <= ry + rh);
        }

        for (let i = 0; i < worlds.length; i++) {
          const cx = startX + i * (cardWidth + cardGap);
          if (inRect(x, y, cx, cardY, cardWidth, cardHeight)) {
            const wId = worlds[i];
            if (wId === "earth" && !earthUnlocked) {
              setStatus("Earth Land is locked!");
            } else if (wId === "sea" && !seaUnlocked) {
              setStatus("Sea Land is locked!");
            } else if (wId === "forest" && !forestUnlocked) {
              setStatus("Forest Land is locked!");
            } else {
              enterWorld(wId);
            }
          }
        }
      });

      /* ==========================================================
          GAME LOOP
      ========================================================== */
 function gameLoop(timestamp) {
        if (!lastTimestamp) {
          lastTimestamp = timestamp;
          requestAnimationFrame(gameLoop);
          return;
        }
        const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.033);
        lastTimestamp = timestamp;

        if (gameState === State.PLAYING) {
          handleTimerAndMusic(dt);
          spawnAsteroid(dt);
          updateAsteroids(dt);
          updateTrampoline(dt);
          updatePlayer(dt);
          updateAlien(dt);
          handleAlienThreatAudio();
          updateProjectiles(dt);
          spawnHeart(dt);
          updateHearts(dt);
          spawnStar(dt);
          updateStars(dt);
          spawnWind(dt);
          updateWinds(dt);
        } else if (gameState === State.POST_TIMER) {
          handleTimerAndMusic(dt);
          updateAlien(dt);
          updateTrampoline(dt);
          updatePlayer(dt);
        } else {
          updateTrampoline(dt);
          updateAlien(dt);
        }

        updateWinEffect(dt);
        updateDeathEffect(dt);

        drawBackground();
        
        if (currentWorld) {
          drawSuctionBeam();
          drawHusks();
          drawAsteroids();
          drawProjectiles();
          drawHearts();
          drawStars();
          drawTrampoline();
          drawLandingTarget();
          drawAlien();
          drawPlayer();
        }

        drawWinEffect();
        drawDeathEffect();
        drawUIOverlay();

        requestAnimationFrame(gameLoop);
      }

      updateStartButtonVisibility();
      updateHUD();
      updateMusicState();
      requestAnimationFrame(gameLoop);
    })();
  </script>
