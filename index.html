<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>10-Second Bounce Challenge</title>
  <style>
    /* ----------------------------------------------------------
       GLOBAL RESET & BODY
    ---------------------------------------------------------- */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #030718;
    }

    /* ----------------------------------------------------------
       MAIN CONTAINER (topBar + canvasWrapper)
    ---------------------------------------------------------- */
    #gameContainer {
      display: flex;
      flex-direction: column;
      height: 100dvh;       /* more stable on iPad Safari */
      overflow: hidden;
      background: #030718; /* simple behind-topBar background */
    }

    /* ----------------------------------------------------------
       TOP HUD BAR
    ---------------------------------------------------------- */
    #topBar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 16px;
      background: linear-gradient(to right, #050814, #0c1230);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 12px;
    }

    .hudGroup {
      display: flex;
      flex-direction: column;
      padding: 4px 8px;
      align-items: center;
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.06);
      min-width: 70px;
    }

    #timerHudGroup {
      position: absolute;
      right: 10px;
    }

    .hudLabel {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #9dacff;
    }

    .hudValue {
      margin-top: 1px;
      font-size: 21px;
      font-weight: 600;
      color:#9dacff;
    }

    /* ----------------------------------------------------------
       CANVAS WRAPPER (scaling container)
    ---------------------------------------------------------- */
    #canvasWrapper {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(
        circle at center,
        #050a16 0%,
        #010208 60%,
        #000000 100%
      );
      padding-bottom: env(safe-area-inset-bottom);
      overflow: hidden;
      min-height: 0; /* Safari flex fix */
    }

    /* ----------------------------------------------------------
       GAME CANVAS (transparent, scaled proportionally)
    ---------------------------------------------------------- */
    #gameCanvas {
      aspect-ratio: 4 / 3;
      width: 100%;
      height: auto;
      max-height: 100%;
      display: block;
      background: transparent;
    }

    /* ----------------------------------------------------------
       TOUCH CONTROLS (overlay)
    ---------------------------------------------------------- */
    #touchControls {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: none; /* default hidden on desktop */
    }

    #touchControls button {
      position: absolute;
      pointer-events: auto;
      font-size: 44px;
      padding: 10px 30px;
      border-radius: 20px;
      border: 1px solid rgba(196,200,212,0.25);
      background: rgba(0,0,0,0.65);
      color: #f5f5ff;
      min-width: 56px;
      bottom: 12px;
    }

    #btnLeft  { left: 12px; }
    #btnRight { right: 12px; }
    #btnStart {
      left: 50%;
      transform: translateX(-50%);
    }

    /* Show controls on tablets/phones, including iPad landscape */
    @media (max-width: 950px), (hover: none) and (pointer: coarse) {
      #touchControls {
        display: block;
      }
      #touchControls button {
        font-size: 64px;
        background-color: color(srgb 0.4454 0.5591 0.68);
      }
    }

    @media (max-width: 680px), (hover: none) and (pointer: coarse) {
      #touchControls button {
        font-size: 100px;
        bottom:50px;
        border: none;
      }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="topBar">
      <div class="hudGroup">
        <span class="hudLabel">Level</span>
        <span class="hudValue" id="hudLevel">1 / 10</span>
      </div>
      <div class="hudGroup">
        <span class="hudLabel">Lives</span>
        <span class="hudValue" id="hudLives">❤️ x5</span>
      </div>
      <div class="hudGroup" id="timerHudGroup"> 
        <span class="hudLabel">Timer</span>
        <span class="hudValue" id="hudTimer">10.0s</span>
      </div>
    </div>

    <div id="canvasWrapper">
      <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <div id="touchControls">
      <button id="btnLeft">⬅️</button>
      <button id="btnStart">▶️</button>
      <button id="btnRight">➡️</button>
    </div>
  </div>

  <script>
  (function () {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const hudLevel = document.getElementById('hudLevel');
    const hudLives = document.getElementById('hudLives');
    const hudTimer = document.getElementById('hudTimer'); 
    
    const W = canvas.width;
    const H = canvas.height;

    // --- Sprites ---
    const rockImg = new Image();        // moving hazards
    const asteroidImg = new Image();    // static husks

    let rockImgLoaded = false;
    let asteroidImgLoaded = false;

    rockImg.src = 'rock.png';
    asteroidImg.src = 'asteroid.png';

    rockImg.onload = () => {
      rockImgLoaded = true;
      console.log('rock.png loaded');
    };

    asteroidImg.onload = () => {
      asteroidImgLoaded = true;
      console.log('asteroid.png loaded');
    };

    // Physics constants
    const GRAVITY = 1000;
    const AX = 400;
    const DAMPING = 0.10;
    const MIDLINE_Y = 300;

    // Alien suction beam
    const ALIEN_SUCTION_Y = 50;
    const ALIEN_BEAM_HALF_WIDTH = 70;

    // Soft ceiling
    const CEILING_Y = 10;

    // Bounce formula
    const VMIN = 500;
    const VMAX = 1500;
    const K = 0.25;

    // Game parameters
    const TOTAL_LEVELS = 10; 
    const INITIAL_LIVES = 10;
    const LEVEL_TIME = 10.0;

    // Obstacle spawn base rate
    const LAMBDA_BASE = 0.2;

    // Level configurations
    const levelConfigs = [
      {
        theme: 'The First Ascent', levelBounces: 4, trampWidthRatio: 1.0, trampSpeed: 0,
        husks: [], lambdaMultiplier: 1.0,
        dirMix: { H: 0.80, D: 0.20, V: 0.0 }, alienSpeedTop: 0, projectileRate: 0
      },
      {
        theme: 'Geo-Drift', levelBounces: 5, trampWidthRatio: 1.0, trampSpeed: 0,
        husks: [{ x: W * 0.5, y: H * 0.45, size: 26 }],
        lambdaMultiplier: 1.1,
        dirMix: { H: 0.75, D: 0.25, V: 0.0 }, alienSpeedTop: 40, projectileRate: 0
      },
      {
        theme: 'High Orbit Passage', levelBounces: 6, trampWidthRatio: 1.0, trampSpeed: 0,
        husks: [{ x: W * 0.4, y: H * 0.32, size: 32 }],
        lambdaMultiplier: 1.25,
        dirMix: { H: 0.70, D: 0.30, V: 0.0 }, alienSpeedTop: 60, projectileRate: 0
      },
      {
        theme: 'The Gravity Well', levelBounces: 7, trampWidthRatio: 1.0, trampSpeed: 0,
        husks: [{ x: W * 0.5, y: H * 0.25, size: 32 }],
        lambdaMultiplier: 1.4,
        dirMix: { H: 0.60, D: 0.35, V: 0.05 }, alienSpeedTop: 80, projectileRate: 0
      },
      {
        theme: 'Precision Landing', levelBounces: 7, trampWidthRatio: 0.7, trampSpeed: 0,
        husks: [
          { x: W * 0.35, y: H * 0.40, size: 26 },
          { x: W * 0.65, y: H * 0.30, size: 26 }
        ],
        lambdaMultiplier: 1.6,
        dirMix: { H: 0.60, D: 0.35, V: 0.05 }, alienSpeedTop: 100, projectileRate: 0
      },
      {
        theme: 'Shifting Ground', levelBounces: 8, trampWidthRatio: 0.5, trampSpeed: 60,
        husks: [{ x: W * 0.5, y: H * 0.38, size: 30 }],
        lambdaMultiplier: 1.8,
        dirMix: { H: 0.60, D: 0.35, V: 0.05 }, alienSpeedTop: 100, projectileRate: 0
      },
      {
        theme: 'Barrage Initiation', levelBounces: 8, trampWidthRatio: 0.5, trampSpeed: 80,
        husks: [
          { x: W * 0.3, y: H * 0.35, size: 30 },
          { x: W * 0.7, y: H * 0.45, size: 30 }
        ],
        lambdaMultiplier: 2.0,
        dirMix: { H: 0.55, D: 0.40, V: 0.05 }, alienSpeedTop: 110, projectileRate: 0.1
      },
      {
        theme: 'Hyper-Drift', levelBounces: 9, trampWidthRatio: 0.4, trampSpeed: 100,
        husks: [
          { x: W * 0.3, y: H * 0.25, size: 30 },
          { x: W * 0.7, y: H * 0.45, size: 30 }
        ],
        lambdaMultiplier: 2.2,
        dirMix: { H: 0.50, D: 0.45, V: 0.05 }, alienSpeedTop: 120, projectileRate: 0.2
      },
      {
        theme: 'The Final Traverse', levelBounces: 9, trampWidthRatio: 0.35, trampSpeed: 120,
        husks: [{ x: W * 0.5, y: H * 0.20, size: 35 }],
        lambdaMultiplier: 2.5,
        dirMix: { H: 0.50, D: 0.45, V: 0.05 }, alienSpeedTop: 140, projectileRate: 0.3
      },
      {
        theme: 'Nebula Gauntlet', levelBounces: 10, trampWidthRatio: 0.30, trampSpeed: 140,
        husks: [{ x: W * 0.5, y: H * 0.15, size: 35 }],
        lambdaMultiplier: 2.75,
        dirMix: { H: 0.40, D: 0.50, V: 0.10 }, alienSpeedTop: 160, projectileRate: 0.4
      }
    ];

    // Input
    const keys = { left: false, right: false, up: false };

    // Touch buttons
    const btnLeft  = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnStart = document.getElementById('btnStart');

    function triggerStart() {
      if (gameState === State.WAITING) {
        startLevelPlay();
      } else if (gameState === State.LEVEL_COMPLETE) {
        if (currentLevel < TOTAL_LEVELS) {
          resetLevel(currentLevel + 1);
        } else {
          gameState = State.WIN;
          displayWinScreen();
        }
      } else if (gameState === State.GAME_OVER) {
        lives = INITIAL_LIVES;
        resetLevel(1);
        gameState = State.WAITING;
      } else if (gameState === State.WIN) {
        lives = INITIAL_LIVES;
        resetLevel(1);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft')  keys.left = true;
      if (e.code === 'ArrowRight') keys.right = true;
      if (e.code === 'ArrowUp' || e.code === 'Space') keys.up = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft')  keys.left = false;
      if (e.code === 'ArrowRight') keys.right = false;
      if (e.code === 'ArrowUp' || e.code === 'Space') keys.up = false;
    });

    function prevent(e) { e.preventDefault(); e.stopPropagation(); }

    // LEFT button
    if (btnLeft) {
      btnLeft.addEventListener('touchstart', (e) => {
        prevent(e);
        keys.left = true;
      }, { passive: false });

      btnLeft.addEventListener('touchend', (e) => {
        prevent(e);
        keys.left = false;
      }, { passive: false });

      btnLeft.addEventListener('mousedown', (e) => {
        e.preventDefault();
        keys.left = true;
      });

      btnLeft.addEventListener('mouseup', (e) => {
        e.preventDefault();
        keys.left = false;
      });

      btnLeft.addEventListener('mouseleave', () => {
        keys.left = false;
      });
    }

    // RIGHT button
    if (btnRight) {
      btnRight.addEventListener('touchstart', (e) => {
        prevent(e);
        keys.right = true;
      }, { passive: false });

      btnRight.addEventListener('touchend', (e) => {
        prevent(e);
        keys.right = false;
      }, { passive: false });

      btnRight.addEventListener('mousedown', (e) => {
        e.preventDefault();
        keys.right = true;
      });

      btnRight.addEventListener('mouseup', (e) => {
        e.preventDefault();
        keys.right = false;
      });

      btnRight.addEventListener('mouseleave', () => {
        keys.right = false;
      });
    }

    // START / JUMP button
    if (btnStart) {
      btnStart.addEventListener('touchstart', (e) => {
        prevent(e);
        keys.up = true;
        triggerStart();
      }, { passive: false });

      btnStart.addEventListener('touchend', (e) => {
        prevent(e);
        keys.up = false;
      }, { passive: false });

      btnStart.addEventListener('click', (e) => {
        e.preventDefault();
        keys.up = true;
        triggerStart();
        setTimeout(() => { keys.up = false; }, 50);
      });
    }

    // Audio
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playBeep(freq, duration, type = 'sine', gainValue = 0.08) {
      try {
        ensureAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = gainValue;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        osc.start(now);
        osc.stop(now + duration);
        gain.gain.setTargetAtTime(0.0001, now + duration * 0.4, duration * 0.3);
      } catch (e) {}
    }

    function playLaunchSound(bounceCount) {
      const baseFreq = 300;
      const freq = baseFreq + bounceCount * 30;
      playBeep(freq, 0.12, 'sawtooth', 0.12);
    }

    function playDeathSound() {
      ensureAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    function playAlienSuckSound() {
      ensureAudio();
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.45);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.5);
      } catch (e) {
        console.warn('playAlienSuckSound error', e);
      }
    }

    function playSuccessSound() {
      ensureAudio();
      console.log('playSuccessSound called');

      try {
        const now = audioCtx.currentTime;
        const freqs = [523.25, 659.25, 783.99, 1046.5];

        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'triangle';
          osc.frequency.value = f;

          gain.gain.setValueAtTime(0.2, now + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.12 + 0.3);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now + i * 0.12);
          osc.stop(now + i * 0.12 + 0.32);
        });

        const bassOsc = audioCtx.createOscillator();
        const bassGain = audioCtx.createGain();
        bassOsc.type = 'sine';
        bassOsc.frequency.setValueAtTime(130.81, now);
        bassGain.gain.setValueAtTime(0.14, now);
        bassGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
        bassOsc.connect(bassGain);
        bassGain.connect(audioCtx.destination);
        bassOsc.start(now);
        bassOsc.stop(now + 0.55);
      } catch (e) {
        console.warn('playSuccessSound error', e);
      }
    }

    function playDangerHum(intensity) {
      if (intensity <= 0 || !audioCtx) return;
      playBeep(120 + 40 * intensity, 0.08, 'sine', 0.02 * intensity);
    }

    function playProjectileFire() {
      ensureAudio();
      playBeep(400, 0.05, 'square', 0.1);
    }

    function playHeartCollectSound() {
      ensureAudio();
      playBeep(880, 0.1, 'triangle', 0.15);
      setTimeout(() => playBeep(1320, 0.1, 'triangle', 0.15), 50);
    }

    let lastMusicTick = 0;

    // Entities
    const player = {
      x: W * 0.5,
      y: H - 80,
      vx: 0,
      vy: 0,
      radius: 14,
      bouncing: false
    };

    const trampoline = {
      x: W * 0.5,
      y: H - 40,
      width: W,
      height: 14,
      dir: 1,
      speed: 0
    };

    let asteroids = [];
    let husks = [];
    let alienProjectiles = []; 
    let hearts = [];
    let stars = [];
    let alien = null;
    let alienDir = 1;
    let alienLanded = false;  
    let lastProjectileTime = 0; 
    let winEffect = null; 
    let alienOpacity = 1.0; 
    let isInvincible = false;
    let deathEffect = null;
    let alienLandingGraceTimer = 0;
    const ALIEN_LANDING_GRACE = 0.40;

    const alienConfig = { size: 28 };

    const State = {
      WAITING: 'waiting',
      PLAYING: 'playing',
      POST_TIMER: 'postTimer',
      LEVEL_COMPLETE: 'levelComplete',
      GAME_OVER: 'gameOver',
      WIN: 'win'
    };
    let gameState = State.WAITING;

    let currentLevel = 1;
    let lives = INITIAL_LIVES;
    let bounceCount = 0;
    let timer = LEVEL_TIME;
    let lastTimestamp = null;

    function setStatus(msg) {
      console.log('[STATUS]', msg);
    }

    function updateStartButtonVisibility() {
      if (!btnStart) return;
      if (gameState === State.PLAYING || gameState === State.POST_TIMER) {
        btnStart.style.display = 'none';
      } else {
        btnStart.style.display = 'block';
      }
    }

    function resetPlayerToTrampolineCenter() {
      const levelCfg = levelConfigs[currentLevel - 1];
      const trampWidth = W * levelCfg.trampWidthRatio;
      trampoline.width = trampWidth;
      trampoline.speed = levelCfg.trampSpeed;
      trampoline.x = W * 0.5;
      trampoline.y = H - 40;
      trampoline.dir = 1;

      player.x = trampoline.x;
      player.y = trampoline.y - trampoline.height / 2 - player.radius - 1;
      player.vx = 0;
      player.vy = 0;
      player.bouncing = false;
    }

    function resetLevel(level) {
      currentLevel = level;
      const lambdaL = LAMBDA_BASE * levelConfigs[currentLevel - 1].lambdaMultiplier;
      levelConfigs[currentLevel - 1].lambda = lambdaL;

      bounceCount = 0;
      timer = LEVEL_TIME;
      asteroids = [];
      alienProjectiles = []; 
      hearts = [];
      stars = [];
      husks = levelConfigs[currentLevel - 1].husks.map(h => ({ ...h }));
      alienDir = 1;
      alienLanded = false;
      alienLandingGraceTimer = 0;
      lastProjectileTime = 0;
      winEffect = null; 
      alienOpacity = 1.0;
      isInvincible = false;

      resetPlayerToTrampolineCenter();
      alien = { x: W * 0.5, y: 25, vy: 0, size: alienConfig.size, restingY: 25 };

      gameState = State.WAITING;
      updateHUD();
      updateStartButtonVisibility();

      const cfg = levelConfigs[currentLevel - 1];
      setStatus(
        `LEVEL ${currentLevel} – ${cfg.theme}. Press SPACE or ↑ to start. ` +
        `Survive 10 seconds, then let the UFO land on you!`
      );
    }

    function updateHUD() {
      const cfg = levelConfigs[currentLevel - 1];
      hudLevel.textContent = `${currentLevel} / ${TOTAL_LEVELS}: ${cfg.theme}`;
      hudLives.textContent = `❤️ x${lives}${isInvincible ? ' ✨' : ''}`;
      hudTimer.textContent = `${timer.toFixed(1)}s`;
    }

    function startLevelPlay() {
      if (gameState === State.WAITING && !player.bouncing) {
        ensureAudio();
        player.bouncing = true;
        bounceCount = 1;
        const vup = computeBounceVelocity(bounceCount);
        player.vy = -vup;
        playLaunchSound(bounceCount);
        gameState = State.PLAYING;
        setStatus(
          `LEVEL ${currentLevel} START! ` +
          `Stay alive for 10 seconds. Avoid hazards and the alien suction beam.`
        );
        updateStartButtonVisibility();
      }
    }

    function computeBounceVelocity(N) {
      return VMIN + (VMAX - VMIN) * (1 - Math.exp(-K * N));
    }

    // HEARTS
    function spawnHeart(dt) {
      if (currentLevel < 5 || gameState !== State.PLAYING || hearts.length > 0) return;
      const probability = dt / 8;
      if (Math.random() < probability) {
        hearts.push({
          x: W * 0.2 + Math.random() * W * 0.6,
          y: -30,
          vy: 0,
          radius: 12,
          deadly: false
        });
      }
    }

    function updateHearts(dt) {
      const HEART_GRAVITY_MULTIPLIER = 0.10;
      hearts.forEach(h => {
        h.vy += GRAVITY * HEART_GRAVITY_MULTIPLIER * dt;
        h.y += h.vy * dt;
      });
      hearts = hearts.filter(h => h.y < H + h.radius);
    }

    // STARS (invincibility)
    function spawnStar(dt) {
      if (currentLevel < 6 || gameState !== State.PLAYING || stars.length > 0) return;
      const probability = dt / 10;
      if (Math.random() < probability) {
        stars.push({
          x: W * 0.2 + Math.random() * W * 0.6,
          y: -30,
          vy: 0,
          radius: 12
        });
      }
    }

    function updateStars(dt) {
      const STAR_GRAVITY_MULTIPLIER = 0.15;
      stars.forEach(s => {
        s.vy += GRAVITY * STAR_GRAVITY_MULTIPLIER * dt;
        s.y += s.vy * dt;
      });
      stars = stars.filter(s => s.y < H + s.radius);
    }

    // PROJECTILES
    function fireProjectile(dt) {
      const cfg = levelConfigs[currentLevel - 1];
      const rate = cfg.projectileRate;
      if (rate <= 0) return;

      if (performance.now() - lastProjectileTime > (1000 / rate)) {
        const dx = player.x - alien.x;
        const dy = player.y - alien.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const speed = 300;
        const vx = (dx / dist) * speed;
        const vy = (dy / dist) * speed;

        alienProjectiles.push({
          x: alien.x,
          y: alien.y + alien.size * 0.5,
          vx, vy,
          radius: 6,
          deadly: true
        });
        
        playProjectileFire();
        lastProjectileTime = performance.now();
      }
    }

    function updateProjectiles(dt) {
      alienProjectiles.forEach(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      });
      alienProjectiles = alienProjectiles.filter(p =>
        p.x > -10 && p.x < W + 10 && p.y > -10 && p.y < H + 10
      );
    }

    // ASTEROIDS
    function spawnAsteroid(dt) {
      const cfg = levelConfigs[currentLevel - 1];
      const lambda = cfg.lambda;
      const prob = lambda * dt;
      if (Math.random() >= prob) return;

      const dirRand = Math.random();
      let type;
      if (dirRand < cfg.dirMix.H) type = 'H';
      else if (dirRand < cfg.dirMix.H + cfg.dirMix.D) type = 'D';
      else type = 'V';

      const size = 24 + Math.random() * 12;
      let x, y, vx, vy;

      if (type === 'H') {
        const fromLeft = Math.random() < 0.5;
        y = 150 + Math.random() * (H - 260);
        x = fromLeft ? -size - 10 : W + size + 10;
        const speed = 120 + Math.random() * 80;
        vx = fromLeft ? speed : -speed;
        vy = 0;
      } else if (type === 'V') {
        x = 80 + Math.random() * (W - 160);
        y = -size - 10;
        vx = 0;
        vy = 140 + Math.random() * 80;
      } else {
        const fromLeft = Math.random() < 0.5;
        x = fromLeft ? -size - 10 : W + size + 10;
        y = 80 + Math.random() * 200;
        const sp = 150 + Math.random() * 80;
        vx = fromLeft ? sp : -sp;
        vy = 40 + Math.random() * 70;
      }

      asteroids.push({ x, y, vx, vy, size });
    }

    function updateAsteroids(dt) {
      if (gameState !== State.PLAYING) return;
      for (let a of asteroids) {
        a.x += a.vx * dt;
        a.y += a.vy * dt;
      }
      asteroids = asteroids.filter(a =>
        a.x > -a.size - 60 &&
        a.x < W + a.size + 60 &&
        a.y > -a.size - 60 &&
        a.y < H + a.size + 60
      );
    }

    function updateTrampoline(dt) {
      const cfg = levelConfigs[currentLevel - 1];
      trampoline.speed = cfg.trampSpeed;
      const halfWidth = trampoline.width / 2;
      
      if (gameState === State.POST_TIMER) {
        trampoline.width = W;
        trampoline.speed = 0;
        trampoline.x = W * 0.5;
        return;
      }

      if (trampoline.speed > 0) {
        trampoline.x += trampoline.dir * trampoline.speed * dt;
        if (trampoline.x - halfWidth < 40) {
          trampoline.x = 40 + halfWidth;
          trampoline.dir *= -1;
        } else if (trampoline.x + halfWidth > W - 40) {
          trampoline.x = W - 40 - halfWidth;
          trampoline.dir *= -1;
        }
      }
    }

    function updatePlayer(dt) {
      const prevY = player.y;

      // Horizontal input
      if (keys.left)  player.vx -= AX * dt;
      if (keys.right) player.vx += AX * dt;

      // Damping above midline
      if (!keys.left && !keys.right && player.y < MIDLINE_Y) {
        player.vx *= (1 - DAMPING * dt);
      }

      // Gravity + integration
      player.vy += GRAVITY * dt;
      player.x  += player.vx * dt;
      player.y  += player.vy * dt;

      // Soft ceiling
      if (player.y < CEILING_Y) {
        player.y = CEILING_Y;
        if (player.vy < 0) player.vy = 0;
      }

      // Horizontal bounds
      if (player.x < player.radius) {
        player.x = player.radius;
        if (player.vx < 0) player.vx = 0;
      }
      if (player.x > W - player.radius) {
        player.x = W - player.radius;
        if (player.vx > 0) player.vx = 0;
      }

      // Out-of-bounds (not in POST_TIMER)
      if (gameState !== State.POST_TIMER) {
        if (player.y > H + player.radius) {
          loseLife('You fell out of bounds.');
          return;
        }
      }

      // Suction beam
      if (gameState === State.PLAYING && player.y < ALIEN_SUCTION_Y && alien) {
        const dx = Math.abs(player.x - alien.x);
        if (dx <= ALIEN_BEAM_HALF_WIDTH) {
          loseLife('You got caught in the alien suction beam!');
          return;
        }
      }

      // ============================
      // PLAYING
      // ============================
      if (gameState === State.PLAYING) {
        if (checkTrampolineCollision(prevY)) {
          bounceOnTrampoline();
        }

        if (!isInvincible) {
          if (checkAsteroidCollision() || checkHuskCollision() || checkProjectileCollision()) {
            loseLife('You hit an obstacle.');
            return;
          }
        }

        checkHeartCollision();
        checkStarCollision();
        return;
      }

      // ============================
      // POST_TIMER
      // ============================
      if (gameState === State.POST_TIMER) {
        // 1) If overlap with UFO → win
        if (alien && checkAlienLandingCircle()) {
          if (currentLevel >= TOTAL_LEVELS) {
            gameState = State.WIN;
          } else {
            gameState = State.LEVEL_COMPLETE;
          }
          displayWinScreen();
          return;
        }

        // 2) While alien is still falling, trampoline can bounce, no death
        if (!alienLanded) {
          checkTrampolineCollision(prevY);
          return;
        }

        // 3) Alien has landed. Run grace window
        alienLandingGraceTimer += dt;

        if (alienLandingGraceTimer <= ALIEN_LANDING_GRACE) {
          if (alien && checkAlienLandingCircle()) {
            if (currentLevel >= TOTAL_LEVELS) {
              gameState = State.WIN;
            } else {
              gameState = State.LEVEL_COMPLETE;
            }
            displayWinScreen();
            return;
          }
          checkTrampolineCollision(prevY);
          return;
        }

        // 4) After grace: still allow win if overlapping
        if (alien && checkAlienLandingCircle()) {
          if (currentLevel >= TOTAL_LEVELS) {
            gameState = State.WIN;
          } else {
            gameState = State.LEVEL_COMPLETE;
          }
          displayWinScreen();
          return;
        }

        // Now, and ONLY now, consider it a miss
        const hitTrampoline = checkTrampolineCollision(prevY);
        const offBottom     = (player.y > H + player.radius);

        if (hitTrampoline || offBottom) {
          loseLife('You missed the alien landing and hit the ground/trampoline.');
          return;
        }

        return;
      }

      // WAITING / LEVEL_COMPLETE / GAME_OVER / WIN: just let it sit
    }

    function circleRectCollision(cx, cy, cr, rx, ry, rw, rh) {
      const closestX = Math.max(rx, Math.min(cx, rx + rw));
      const closestY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - closestX;
      const dy = cy - closestY;
      return (dx * dx + dy * dy) <= cr * cr;
    }

    function circleCircleCollision(ax, ay, ar, bx, by, br) {
      const dx = ax - bx;
      const dy = ay - by;
      const distSq = dx * dx + dy * dy;
      const r = ar + br;
      return distSq <= r * r;
    }

    function checkTrampolineCollision(prevY) {
      const halfWidth = trampoline.width / 2;
      const rx = trampoline.x - halfWidth;
      const ry = trampoline.y - trampoline.height / 2;
      const rw = trampoline.width;
      const rh = trampoline.height;

      const surfaceY = ry;

      const horizOverlap =
        (player.x + player.radius > rx) &&
        (player.x - player.radius < rx + rw);

      // Swept test
      if (player.vy > 0 && horizOverlap && typeof prevY === 'number') {
        const prevBottom = prevY + player.radius;
        const currBottom = player.y + player.radius;

        if (prevBottom <= surfaceY && currBottom >= surfaceY) {
          player.y = surfaceY - player.radius - 0.5;
          return true;
        }
      }

      // Fallback overlap
      if (
        player.vy > 0 &&
        circleRectCollision(player.x, player.y, player.radius, rx, ry, rw, rh)
      ) {
        player.y = surfaceY - player.radius - 0.5;
        return true;
      }

      return false;
    }

    function bounceOnTrampoline() {
      if (gameState === State.PLAYING) {
        bounceCount++;
        const vup = computeBounceVelocity(bounceCount);
        player.vy = -vup;
        playLaunchSound(bounceCount);
        updateHUD();
      } else {
        player.vy *= -0.5;
      }
    }

    function checkAsteroidCollision() {
      for (let a of asteroids) {
        if (circleRectCollision(
          player.x, player.y, player.radius,
          a.x - a.size / 2, a.y - a.size / 2, a.size, a.size
        )) {
          return true;
        }
      }
      return false;
    }

    function checkHuskCollision() {
      for (let h of husks) {
        if (circleCircleCollision(player.x, player.y, player.radius, h.x, h.y, h.size)) {
          return true;
        }
      }
      return false;
    }

    function checkProjectileCollision() {
      for (let p of alienProjectiles) {
        if (p.deadly && circleCircleCollision(player.x, player.y, player.radius, p.x, p.y, p.radius)) {
          p.deadly = false; 
          return true; 
        }
      }
      return false;
    }

    function checkHeartCollision() {
      for (let i = hearts.length - 1; i >= 0; i--) {
        const h = hearts[i];
        if (circleCircleCollision(player.x, player.y, player.radius, h.x, h.y, h.radius)) {
          lives++;
          playHeartCollectSound();
          setStatus('BONUS! +1 Life!');
          hearts.splice(i, 1);
          updateHUD();
          return true;
        }
      }
      return false;
    }

    function checkStarCollision() {
      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];
        if (circleCircleCollision(player.x, player.y, player.radius, s.x, s.y, s.radius)) {
          isInvincible = true;
          playHeartCollectSound();
          setStatus('BONUS! Invincibility for this level!');
          stars.splice(i, 1);
          updateHUD();
          return true;
        }
      }
      return false;
    }

    function createAlienForPostTimer() {
      const size = alienConfig.size;

      trampoline.width = W;
      trampoline.speed = 0;
      trampoline.x = W * 0.5;
      trampoline.dir = 0;
      
      alien.vy = 260; 
      alien.restingY = trampoline.y - trampoline.height / 2 - size * 0.4;
      alienLanded = false;
      alienLandingGraceTimer = 0;

      player.vy = Math.max(0, player.vy);
    }

    function updateAlien(dt) {
      if (!alien) return;
      const cfg = levelConfigs[currentLevel - 1];

      if (gameState === State.POST_TIMER) {
        if (!alienLanded && alien.y < alien.restingY) {
          alien.vy += GRAVITY * 0.1 * dt; 
          alien.y += alien.vy * dt;

          if (alien.y >= alien.restingY) {
            alien.y = alien.restingY;
            alien.vy = 0;
            alienLanded = true;
            alienLandingGraceTimer = 0;
          }
        }
      } else if (gameState === State.PLAYING || gameState === State.WAITING) {
        alien.y = 25;
        const speed = cfg.alienSpeedTop;
        if (speed > 0) {
          alien.x += alienDir * speed * dt;
          const margin = 60;
          if (alien.x < margin) {
            alien.x = margin;
            alienDir *= -1;
          } else if (alien.x > W - margin) {
            alien.x = W - margin;
            alienDir *= -1;
          }
        }
        if (gameState === State.PLAYING) {
          fireProjectile(dt);
        }
      }
    }

    function checkAlienLandingCircle() {
      if (!alien) return false;

      const baseRadius = alien.size * 1.0;
      const bonusRadius = 16;
      const alienRadius = baseRadius + bonusRadius;

      const landed = circleCircleCollision(
        player.x, player.y, player.radius,
        alien.x, alien.y, alienRadius
      );

      if (!landed) {
        const dx = Math.abs(player.x - alien.x);
        const dy = player.y - alien.y;
        if (dx < alienRadius * 0.8 && dy > 0 && dy < alienRadius * 0.7) {
          return true;
        }
      }

      return landed;
    }

    function loseLife(reason) {
      if (gameState === State.GAME_OVER || gameState === State.WIN) return;

      deathEffect = {
        x: player.x,
        y: player.y,
        radius: player.radius,
        time: 0
      };

      winEffect = null;
      alienOpacity = 1.0;

      if (reason && reason.toLowerCase().includes('suction')) {
        playAlienSuckSound();
      } else {
        playDeathSound();
      }

      lives--;
      const prefix = reason ? `${reason} ` : '';

      if (lives <= 0) {
        gameState = State.GAME_OVER;
        setStatus(
          `${prefix}GAME OVER. Press SPACE or ↑ to restart from Level 1.`
        );
      } else {
        gameState = State.WAITING;
        setStatus(
          `${prefix}You lost a life. Lives left: ${lives}. ` +
          `Press SPACE or ↑ to retry Level ${currentLevel}.`
        );
      }
      
      resetPlayerToTrampolineCenter();
      alien = { x: W * 0.5, y: 25, vy: 0, size: alienConfig.size, restingY: 25 }; 

      asteroids = [];
      alienProjectiles = []; 
      hearts = [];
      stars = [];
      timer = LEVEL_TIME;
      bounceCount = 0;
      alienLanded = false;
      isInvincible = false;
      updateHUD();
      updateStartButtonVisibility();
    }

    function displayWinScreen() {
      playSuccessSound();
      winEffect = {
        x: player.x,
        y: player.y,
        radius: player.radius,
        time: 0
      };
      updateStartButtonVisibility();
      alienOpacity = 1.0; 

      if (gameState === State.WIN) {
        setStatus(`GAME COMPLETE! You mastered all ${TOTAL_LEVELS} levels! Press SPACE or ↑ to play again.`);
      } else {
        setStatus(`LEVEL ${currentLevel} COMPLETE! Press SPACE or ↑ for Level ${currentLevel + 1}.`);
      }
    }

    function handleTimerAndMusic(dt) {
      if (gameState === State.PLAYING) {
        timer -= dt;
        if (timer <= 0) {
          timer = 0;
          gameState = State.POST_TIMER;
          setStatus('Time up! The alien is falling — stay under it so it lands on you!');
          createAlienForPostTimer();
        }
      }
      updateHUD();

      if (gameState === State.PLAYING || gameState === State.POST_TIMER) {
        const now = performance.now() / 1000;
        const remaining = timer;
        let interval;
        if (remaining > 5) {
          interval = 1.1;
        } else if (remaining > 2.5) {
          interval = 0.5;
        } else {
          interval = 0.25;
        }
        if (now - lastMusicTick > interval) {
          lastMusicTick = now;
          const base = currentLevel === 1 ? 220 : 260 + currentLevel * 20;
          const pitchRamp = (LEVEL_TIME - remaining) / LEVEL_TIME;
          const freq = base + 140 * pitchRamp;
          playBeep(freq, 0.08, 'triangle', 0.05);
        }
      }
    }

    function handleAlienThreatAudio() {
      if (!alien || !audioCtx) return;
      if (gameState === State.PLAYING) {
        const dx = Math.abs(player.x - alien.x);
        if (player.y < ALIEN_SUCTION_Y && dx <= ALIEN_BEAM_HALF_WIDTH * 1.2) {
          const distY = Math.max(0, ALIEN_SUCTION_Y - player.y);
          const intensity = Math.max(0.1, 1 - distY / 120);
          playDangerHum(intensity);
        }
      }
    }

    function drawBackground() {
      ctx.save();
      ctx.fillStyle = '#02030c';
      ctx.fillRect(0, 0, W, H);

      const gradient = ctx.createRadialGradient(W / 2, H * 0.2, 0, W / 2, H * 0.2, H);
      gradient.addColorStop(0, '#151c3a');
      gradient.addColorStop(0.5, '#050814');
      gradient.addColorStop(1, '#000000');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      for (let i = 0; i < 40; i++) {
        const x = (i * 73) % W;
        const y = (i * 131) % H * 0.6;
        const r = (i % 3 === 0) ? 1.3 : 0.8;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawSuctionBeam() {
      if (!alien) return;
      ctx.save();
      const x = alien.x;
      const top = 0;
      const bottom = ALIEN_SUCTION_Y;
      const beamWidth = ALIEN_BEAM_HALF_WIDTH * 2;

      const grd = ctx.createLinearGradient(x, top, x, bottom);
      grd.addColorStop(0, 'rgba(182,120,255,0.0)');
      grd.addColorStop(0.4, 'rgba(182,120,255,0.25)');
      grd.addColorStop(1, 'rgba(130,60,220,0.45)');

      ctx.fillStyle = grd;
      ctx.fillRect(x - ALIEN_BEAM_HALF_WIDTH, top, beamWidth, bottom - top);

      ctx.strokeStyle = 'rgba(220,180,255,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x - ALIEN_BEAM_HALF_WIDTH, top);
      ctx.lineTo(x - ALIEN_BEAM_HALF_WIDTH, bottom);
      ctx.moveTo(x + ALIEN_BEAM_HALF_WIDTH, top);
      ctx.lineTo(x + ALIEN_BEAM_HALF_WIDTH, bottom);
      ctx.stroke();

      ctx.restore();
    }

    function drawTrampoline() {
      const halfWidth = trampoline.width / 2;
      const x = trampoline.x - halfWidth;
      const y = trampoline.y - trampoline.height / 2;

      const grd = ctx.createLinearGradient(x, y, x, y + trampoline.height);
      grd.addColorStop(0, '#3ef19e');
      grd.addColorStop(1, '#17a45f');
      ctx.fillStyle = grd;
      ctx.fillRect(x, y, trampoline.width, trampoline.height);

      ctx.strokeStyle = '#0a4f31';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + trampoline.height);
      ctx.moveTo(x + trampoline.width, y);
      ctx.lineTo(x + trampoline.width, y + trampoline.height);
      ctx.stroke();
      ctx.lineWidth = 1;
    }

    function drawPlayer() {
      if (winEffect || deathEffect) return;

      ctx.save();

      if (isInvincible) {
        const time = performance.now() * 0.001;
        const baseColor = Math.floor(time * 360 / 0.5);
        ctx.lineWidth = 4;
        for (let i = 0; i < 6; i++) {
          const hue = (baseColor + i * 60) % 360;
          ctx.strokeStyle = `hsl(${hue}, 100%, 70%)`;
          ctx.beginPath();
          ctx.arc(player.x, player.y, player.radius + 4, 
            i * (Math.PI / 3), (i + 1) * (Math.PI / 3));
          ctx.stroke();
        }
        ctx.lineWidth = 1;
      }

      const glow = ctx.createRadialGradient(
        player.x, player.y, player.radius * 0.2,
        player.x, player.y, player.radius * 1.3
      );
      glow.addColorStop(0, '#5bd0ff');
      glow.addColorStop(1, '#2044ff');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.arc(player.x - 4, player.y - 4, player.radius * 0.5, 0, Math.PI * 2);
      ctx.stroke();
      
      ctx.restore();
    }

    function drawAsteroids() {
      for (let a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate((a.x + a.y) * 0.002);

        const size = a.size;

        if (rockImgLoaded) {
          ctx.drawImage(rockImg, -size / 2, -size / 2, size, size);
        } else {
          ctx.fillStyle = '#ff3b3b';
          ctx.fillRect(-size / 2, -size / 2, size, size);
        }

        ctx.restore();
      }
    }

    function drawHusks() {
      for (let h of husks) {
        const size = h.size * 2;

        if (asteroidImgLoaded) {
          ctx.drawImage(
            asteroidImg,
            h.x - size / 2,
            h.y - size / 2,
            size,
            size
          );
        } else {
          ctx.fillStyle = '#9ea2b0';
          ctx.strokeStyle = '#555a68';
          ctx.lineWidth = 1.4;
          const sides = 6;
          const r = h.size;
          ctx.beginPath();
          for (let i = 0; i < sides; i++) {
            const angle = (Math.PI * 2 / sides) * i + Math.PI / 6;
            const x = h.x + Math.cos(angle) * r;
            const y = h.y + Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.lineWidth = 1;
        }
      }
    }

    function drawProjectiles() {
      ctx.fillStyle = '#f0d4ff';
      for (let p of alienProjectiles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawHearts() {
      ctx.save();
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let h of hearts) {
        ctx.fillText("❤️", h.x, h.y + 2);
      }
      ctx.restore();
    }

    function drawStars() {
      ctx.save();
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let s of stars) {
        ctx.fillText("⭐", s.x, s.y + 2);
      }
      ctx.restore();
    }

    function drawAlien() {
      if (!alien) return;
      
      ctx.save();
      ctx.globalAlpha = alienOpacity; 
      
      ctx.translate(alien.x, alien.y);
      const s = alien.size;
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.6);
      ctx.lineTo(-s * 0.7, s * 0.4);
      ctx.lineTo(s * 0.7, s * 0.4);
      ctx.closePath();

      const grad = ctx.createLinearGradient(-s, -s, s, s);
      grad.addColorStop(0, '#b45bff');
      grad.addColorStop(1, '#7b1cff');
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.strokeStyle = '#f0d4ff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, -s * 0.15, s * 0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#22003a';
      ctx.beginPath();
      ctx.arc(0, -s * 0.15, s * 0.08, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
      ctx.lineWidth = 1;
    }

    function drawLandingTarget() {
      const isPreviewTime = (gameState === State.PLAYING && timer < 1.6);
      const isFallingPhase = (gameState === State.POST_TIMER && !alienLanded);

      if (!isPreviewTime && !isFallingPhase) return;
      if (!alien) return;

      const indicatorWidth = alien.size * 2.5;
      const indicatorHeight = 12;

      const x = alien.x - indicatorWidth / 2;
      const y = trampoline.y - trampoline.height - 6;

      const alpha = 0.5 + Math.sin(performance.now() / 300) * 0.2;

      ctx.save();
      ctx.fillStyle = `rgba(180,255,180,${alpha})`;
      ctx.fillRect(x, y, indicatorWidth, indicatorHeight);
      ctx.restore();
    }

    function updateWinEffect(dt) {
      if (!winEffect) return;
      winEffect.time += dt;
      const duration = 0.5;
      if (winEffect.time <= duration) {
        alienOpacity = 1.0 - (winEffect.time / duration); 
      } else {
        winEffect = null;
        alienOpacity = 0.0;
      }
    }

    function drawWinEffect() {
      if (!winEffect) return;
      
      const duration = 0.5;
      const maxRadius = 150;
      const opacity = 1.0 - (winEffect.time / duration);
      const currentRadius = winEffect.radius + (maxRadius * winEffect.time * 2);

      ctx.save();
      ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
      ctx.lineWidth = 6 * opacity;

      ctx.beginPath();
      ctx.arc(winEffect.x, winEffect.y, currentRadius, 0, Math.PI * 2);
      ctx.stroke();
      
      ctx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.8})`;
      ctx.beginPath();
      ctx.arc(winEffect.x, winEffect.y, winEffect.radius * 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function updateDeathEffect(dt) {
      if (!deathEffect) return;
      deathEffect.time += dt;
      const duration = 0.4;
      if (deathEffect.time > duration) {
        deathEffect = null;
      }
    }

    function drawDeathEffect() {
      if (!deathEffect) return;

      const duration = 0.4;
      const t = deathEffect.time / duration;
      const opacity = 1.0 - t;
      const maxRadius = 120;
      const currentRadius = deathEffect.radius + maxRadius * t * 2;

      ctx.save();
      ctx.strokeStyle = `rgba(255, 120, 120, ${opacity})`;
      ctx.lineWidth = 5 * opacity;

      ctx.beginPath();
      ctx.arc(deathEffect.x, deathEffect.y, currentRadius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = `rgba(255, 200, 200, ${opacity * 0.8})`;
      ctx.beginPath();
      ctx.arc(deathEffect.x, deathEffect.y, deathEffect.radius * 1.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawUIOverlay() {
      ctx.save();
      ctx.font = '14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.textBaseline = 'top';

      let message = '';
      let subMessage = '';

      if (gameState === State.WAITING) {
        drawInstructions();
        ctx.restore();
        return;
      } else if (gameState === State.LEVEL_COMPLETE) {
        message = `LEVEL ${currentLevel} COMPLETE!`;
        subMessage = (currentLevel < TOTAL_LEVELS)
          ? `Press SPACE or ↑ for Level ${currentLevel + 1}.`
          : 'You beat all levels!';
      } else if (gameState === State.GAME_OVER) {
        message = 'GAME OVER';
        subMessage = 'Press SPACE or ↑ to restart from Level 1.';
      } else if (gameState === State.WIN) {
        drawFinalWinScreen();
        ctx.restore();
        return;
      }

      if (message) {
        ctx.textAlign = 'center';

        const boxWidth = 420;
        const boxHeight = subMessage ? 80 : 54;
        const boxX = W / 2 - boxWidth / 2;
        const boxY = H / 2 - boxHeight / 2;

        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.strokeRect(boxX + 0.5, boxY + 0.5, boxWidth - 1, boxHeight - 1);

        ctx.fillStyle = '#ffe8a9';
        ctx.font = '18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillText(message, W / 2, boxY + 14);

        if (subMessage) {
          ctx.fillStyle = '#c5ccff';
          ctx.font = '13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
          ctx.fillText(subMessage, W / 2, boxY + 40);
        }
      }

      ctx.restore();
    }

    function drawInstructions() {
      if (gameState !== State.WAITING || currentLevel !== 1) return;
      
      ctx.save();
      ctx.textAlign = 'center';
      
      const rules = [
        "Survive for 10 seconds without hitting objects or the UFO (purple area).",
        "Use Left/Right arrows (← →) or on-screen buttons to move.",
        "After time is up, let the UFO land on you to win the level."
      ];
      
      const boxWidth = 520;
      const boxHeight = 220;
      const boxX = W / 2 - boxWidth / 2;
      const boxY = H / 2 - boxHeight / 2;

      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);

      ctx.fillStyle = '#ffe8a9';
      ctx.font = '22px system-ui';
      ctx.fillText("HOW TO PLAY", W / 2, boxY + 24);

      ctx.textAlign = 'left';
      ctx.font = '14px system-ui';
      ctx.fillStyle = '#c5ccff';
      
      rules.forEach((rule, index) => {
        ctx.fillText(rule, boxX + 30, boxY + 60 + index * 24);
      });

      ctx.textAlign = 'center';
      ctx.fillStyle = '#3ef19e';
      ctx.font = '16px system-ui';
      ctx.fillText("PRESS ↑ ARROW OR TAP ▶️ TO START", W / 2, boxY + boxHeight - 34);

      ctx.restore();
    }

    function drawFinalWinScreen() {
      if (gameState !== State.WIN) return;

      ctx.save();
      ctx.textAlign = 'center';

      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.fillRect(0, 0, W, H);

      const boxWidth  = 520;
      const boxHeight = 260;
      const boxX = W / 2 - boxWidth / 2;
      const boxY = H / 2 - boxHeight / 2;

      const grd = ctx.createLinearGradient(boxX, boxY, boxX + boxWidth, boxY + boxHeight);
      grd.addColorStop(0, 'rgba(60, 255, 180, 0.18)');
      grd.addColorStop(1, 'rgba(140, 180, 255, 0.28)');
      ctx.fillStyle = grd;
      ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.fillRect(boxX + 6, boxY + 6, boxWidth - 12, boxHeight - 12);

      ctx.strokeStyle = 'rgba(255,255,255,0.16)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(boxX + 6.5, boxY + 6.5, boxWidth - 13, boxHeight - 13);

      ctx.fillStyle = '#3ef19e';
      ctx.font = '26px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillText('NEBULA GAUNTLET CLEARED!', W / 2, boxY + 38);

      ctx.fillStyle = '#ffe8a9';
      ctx.font = '16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillText(`You survived all ${TOTAL_LEVELS} levels.`, W / 2, boxY + 70);

      ctx.font = '14px system-ui';
      ctx.fillStyle = '#c5ccff';
      ctx.fillText(`Lives remaining: ${lives}`, W / 2, boxY + 104);
      ctx.fillText('Alien evasions mastered. Bounce control: certified.', W / 2, boxY + 128);

      const feats = [
        '• Dodged rocks, asteroids, beams, and projectiles',
        '• Timed the final landings with a falling UFO',
        '• Collected powerups and survived the gauntlet'
      ];
      ctx.textAlign = 'left';
      feats.forEach((line, i) => {
        ctx.fillText(line, boxX + 40, boxY + 160 + i * 18);
      });

      ctx.textAlign = 'center';
      ctx.fillStyle = '#3ef19e';
      ctx.font = '15px system-ui';
      ctx.fillText('PRESS ↑ OR SPACE TO PLAY AGAIN', W / 2, boxY + boxHeight - 28);

      ctx.restore();
    }

    function gameLoop(timestamp) {
      if (!lastTimestamp) {
        lastTimestamp = timestamp;
        requestAnimationFrame(gameLoop);
        return;
      }
      const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.033);
      lastTimestamp = timestamp;

      if (gameState === State.PLAYING) {
        handleTimerAndMusic(dt);
        spawnAsteroid(dt);
        updateAsteroids(dt);
        updateTrampoline(dt);
        updatePlayer(dt);
        updateAlien(dt);
        handleAlienThreatAudio();
        updateProjectiles(dt);
        spawnHeart(dt);
        updateHearts(dt);
        spawnStar(dt);
        updateStars(dt);

      } else if (gameState === State.POST_TIMER) {
        handleTimerAndMusic(dt);
        updateAlien(dt);
        updateTrampoline(dt);
        updatePlayer(dt);

      } else if (
        gameState === State.WAITING ||
        gameState === State.LEVEL_COMPLETE ||
        gameState === State.GAME_OVER ||
        gameState === State.WIN
      ) {
        updateTrampoline(dt);
        updateAlien(dt);
      }

      updateWinEffect(dt);
      updateDeathEffect(dt);

      drawBackground();
      drawSuctionBeam();
      drawHusks();
      drawAsteroids();
      drawProjectiles();
      drawHearts();
      drawStars();
      drawTrampoline();
      drawLandingTarget();
      drawAlien();
      drawPlayer();
      drawWinEffect();
      drawDeathEffect();
      drawUIOverlay();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        if (gameState === State.WAITING) {
          startLevelPlay();
        } else if (gameState === State.LEVEL_COMPLETE) {
          if (currentLevel < TOTAL_LEVELS) {
            resetLevel(currentLevel + 1);
          } else {
            gameState = State.WIN;
            displayWinScreen();
          }
        } else if (gameState === State.GAME_OVER) {
          lives = INITIAL_LIVES;
          resetLevel(1);
          gameState = State.WAITING;
        } else if (gameState === State.WIN) {
          lives = INITIAL_LIVES;
          resetLevel(1);
        }
        updateStartButtonVisibility();
      }
    });

    resetLevel(1);
    updateStartButtonVisibility();
    requestAnimationFrame(gameLoop);
  })();
  </script>
</body>
</html>
